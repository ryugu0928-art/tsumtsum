  // ------------------------------------------------------------
  // ナミネ：スキル効果中、盤面で2番目に多いサブツムをソラに変化させる
  // ------------------------------------------------------------
  const NAMINE_DURATION = 6; // 秒
  const NAMINE_SKILL_RANGE = 3.2; // ナミネ/ソラを消す際に巻き込む範囲（ボム爆発と同程度＝ツム半径の3.2倍）

  function skillNamine(){
    // 前回のスキル効果がまだ残っている場合（ソラが元に戻る前の再発動）は、
    // 先に前回分を即座に元の種類へ戻してから今回の判定に入る
    if(namineActive){
      clearTimeout(namineEndTimer);
      const prevOriginalType = TSUM_TYPES.find(t=>t.key===namineTransformedKey);
      if(prevOriginalType){
        tsums.filter(t=> t.type.key==='sora' && !t.isBomb && !t.ghost)
          .forEach(t=> transformTsumType(t, prevOriginalType));
      }
      namineActive = false;
      namineTransformedKey = null;
    }

    // マイツム（ナミネ）以外のサブツムを種類ごとに集計し、2番目に多い種類を探す
    const counts = {};
    tsums.forEach(t=>{
      if(t.isMine || t.isBomb || t.ghost || t.type.key==='sora') return;
      counts[t.type.key] = (counts[t.type.key]||0) + 1;
    });
    const ranked = Object.entries(counts).sort((a,b)=> b[1]-a[1]);

    if(ranked.length < 2){
      // 2番目に多い種類が存在しない（サブツムが1種類以下）場合はスキルを消費せず不発扱いにする
      showSkillLabel('メモリーチェイン！ 対象がいなかった…');
      finishSkill();
      return;
    }

    const targetKey = ranked[1][0];
    const targets = tsums.filter(t=> t.type.key===targetKey && !t.isBomb && !t.ghost);
    if(targets.length===0){
      showSkillLabel('メモリーチェイン！ 対象がいなかった…');
      finishSkill();
      return;
    }
    namineTransformedKey = targetKey;
    const targetName = (TSUM_TYPES.find(tt=>tt.key===targetKey)||{}).name || '';

    // 変化演出中は盤面の時間を止める
    boardFrozen = true;
    pauseTimer(700);

    const flash = document.createElement('div');
    flash.className = 'namineTransformFlashLayer';
    board.appendChild(flash);
    setTimeout(()=> flash.remove(), 520);

    targets.forEach(t=>{
      t.el.classList.add('soraTransforming');
    });

    showSkillLabel(`メモリーチェイン！ ${targetName}がソラに変化`);

    setTimeout(()=>{
      targets.forEach(t=> transformTsumType(t, SORA_TYPE));
      boardFrozen = false;
      finishSkill();
      namineActive = true;
      clearTimeout(namineEndTimer);
      namineEndTimer = setTimeout(endNamineSkill, NAMINE_DURATION*1000);
    }, 500);
  }

  // 効果終了時、ソラを元の種類に戻す

  // ツムの種類を差し替える共通処理（座標・物理状態は維持したままDOM要素だけ作り直す）
  function transformTsumType(t, newType){
    t.type = newType;
    const isMine = isMineType(newType);
    t.isMine = isMine;
    const size = t.r*2;
    const newEl = createTsumEl(newType, isMine, size);
    if(t.isBig) newEl.classList.add('bigTsum');
    newEl.style.transform = t.el.style.transform;
    t.el.replaceWith(newEl);
    t.el = newEl;
    attachHandlers(t);
  }

  // 出現アニメーション（.tsum.hookAppearing）の再生時間。CSSのanimation時間と合わせる。
  const HOOK_APPEAR_ANIM_MS = 900;

  // 最終決戦フック船長のスキル本体：
  // 画面中央に「怒ったフック船長」を新規出現させる（大ツムと同じ大きさ）。
  // 出現の瞬間は時間を止め、本人だけスポットライトを当てながら出現アニメーションを再生する。
  // 効果時間（約2秒）の間、怒ったフック船長とフック船長本体を繋ぐたびに、
  // 時間が止まって斜めに切るアニメーション→斜めライン消去→怒ったフック船長が大きくなるアニメーション、
  // という流れが起き、繋ぐたびに次の消去範囲が拡大していく。効果時間が短いため繋ぎ続けるスピードが重要。
  function skillHookFinalBattle(){
    // 前回のスキル効果がまだ残っている場合は、先に前回分を後始末してから今回の判定に入る
    if(hookActive){
      endHookSkill();
    }

    // 画面（盤面）中央に、大ツムと同じ大きさで怒ったフック船長を新規出現させる。
    const bigR = Math.round(tsumRadius*BIG_TSUM_SCALE);
    const boardCx = boardW/2, boardCy = boardH/2;
    const hookAngry = spawnTsum(boardCx, boardCy, 0, 0, HOOK_ANGRY_TYPE, false);
    resizeTsum(hookAngry, bigR);
    hookAngry.vx = 0; hookAngry.vy = 0;
    // resting は毎フレーム物理判定で上書きされてしまい、支えの無い空中では維持できない
    // （＝重力で落下して画面下の方に出現してしまう）ため、出現演出中は ghost にして
    // 重力・物理演算そのものを完全に止め、確実に中央に留まるようにする。
    hookAngry.ghost = true;

    // 出現直後の半径を「成長比率」の基準として記録する。
    // 消去帯の初期の太さは、通常ツム半径の1.6倍程度を基準値とする。
    HOOK_ANGRY_INITIAL_R = bigR;
    HOOK_BAND_BASE = tsumRadius * 1.6;

    const flash = document.createElement('div');
    flash.className = 'namineTransformFlashLayer';
    board.appendChild(flash);
    setTimeout(()=> flash.remove(), 520);

    showSkillLabel('怒ったフック船長が現れた！');

    // 出現アニメーション中は入力・スキル効果時間の経過・ゲーム全体の残り時間を止める
    // （斜め消去演出や元に戻る演出と同じ hookAnimFreeze の仕組みを流用）
    hookAnimFreeze = true;
    hookAnimGhostRef = hookAngry; // 演出中は他のツムと一切干渉させないための参照
    appEl.classList.add('hookAnimDimmed'); // 怒ったフック船長以外を薄暗くする
    hookAngry.el.classList.add('hookSpotlight'); // 怒ったフック船長自身は暗くならないようにする
    // アニメーション側のtransform(scale/rotate)が本来の配置(translate)を消してしまわないよう、
    // 現在の配置translateを --hookPos に渡してから、出現アニメーションを開始する
    hookAngry.el.style.setProperty('--hookPos', `translate(${hookAngry.x - hookAngry.r}px, ${hookAngry.y - hookAngry.r}px)`);
    hookAngry.el.classList.add('hookAppearing');
    clearInterval(timerHandle);
    clearTimeout(timerResumeTimeout);

    setTimeout(()=>{
      hookAngry.el.classList.remove('hookAppearing');
      // アニメーション終了後、確実に本来の配置(translate)へ戻す（キャッシュされていても再描画を強制する）
      hookAngry._lastX = undefined; hookAngry._lastY = undefined;
      renderTsumPosition(hookAngry);
      // ghost解除：以後は通常どおり他のツムと衝突しつつ物理演算に従う
      if(tsums.includes(hookAngry)){
        hookAngry.ghost = false;
        hookAngry.resting = true; // 解除直後は一旦安定扱いにし、次フレームの物理判定に委ねる
      }
      hookAnimFreeze = false;
      hookAnimGhostRef = null;
      appEl.classList.remove('hookAnimDimmed');
      hookAngry.el.classList.remove('hookSpotlight');
      resumeTimerNow();

      finishSkill();
      hookActive = true;
      hookRemainingMs = HOOK_DURATION*1000; // 残り時間をセット。以後 frameLoop 内で boardFrozen でない間だけ減っていく
    }, HOOK_APPEAR_ANIM_MS);
  }

  // 効果終了時、まだ怒ったフック船長が残っていればフック船長本体に戻す（サイズも通常に戻す）。
  // 画面を薄暗くし、怒ったフック船長にスポットライトを当てながら「元に戻るアニメーション」を再生し、
  // 終わったらそのまま通常のフック船長として盤面に残す。
  const HOOK_REVERT_ANIM_MS = 700; // .tsum.hookReverting のアニメーション時間（CSSのanimation時間と合わせる）
  function endHookSkill(){
    hookActive = false;
    const hookAngryTsums = tsums.filter(t=> t.type.key==='hookAngry' && !t.isBomb && !t.ghost);
    const originalType = TSUM_TYPES.find(t=>t.key==='hook');
    if(originalType && hookAngryTsums.length>0){
      hookAnimFreeze = true; // 入力・スキル効果時間の経過を止める（斜め消去演出と同様）
      appEl.classList.add('hookAnimDimmed'); // 画面を薄暗くする
      hookAngryTsums.forEach(t=> t.el.classList.add('hookSpotlight')); // 戻る本人だけは暗くならないようにする
      clearInterval(timerHandle);
      clearTimeout(timerResumeTimeout);

      let remaining = hookAngryTsums.length;
      const finishOne = ()=>{
        remaining--;
        if(remaining<=0){
          // 全員が元に戻り終わったら、薄暗い演出を解除して通常状態へ復帰する
          hookAnimFreeze = false;
          appEl.classList.remove('hookAnimDimmed');
          resumeTimerNow();
        }
      };

      hookAngryTsums.forEach(t=>{
        t.el.classList.add('hookReverting');
        setTimeout(()=>{
          if(tsums.includes(t)){
            resizeTsum(t, tsumRadius);
            t.isBig = false;
            transformTsumType(t, originalType); // 元に戻った後は、通常のフック船長としてそのまま盤面に残る
            t.el.classList.remove('hookSpotlight');
          }
          finishOne();
        }, HOOK_REVERT_ANIM_MS);
      });
    }
  }

  // 野獣：画面右上から左下へ鋭い爪で引っ掻き、斜めライン状（5ツム分ほどの幅）にツムを消去する。
  // ボムも巻き込んで消去でき、発動中（引っ掻き演出〜消去）は盤面の時間を完全に停止する。
  const BEAST_CLAW_ANIM_MS = 650;   // 爪が引っ掻く演出の時間
  const BEAST_BAND_HALF_RATIO = 3.5; // 斜め帯の半幅（tsumRadius基準）。以前より幅広に。
  const BEAST_LINE_ANGLE_DEG = 35;   // 斜めラインの角度（鉛直から何度傾けるか）。右上→左下の対角に近い角度。
  const BEAST_LINE_X_OFFSET_RATIO = 0.7; // 斜めラインの基準点を盤面中央から右へずらす量（tsumRadius基準）
  function skillBeastClaw(){
    // 演出〜消去が終わるまで、盤面の物理演算とゲーム内タイマーを完全に停止する
    boardFrozen = true;
    pauseTimer(BEAST_CLAW_ANIM_MS + 400);

    // 盤面中央を通る斜めライン（右上から左下）を基準に、帯状の範囲を巻き込む。
    // 見た目が少し左寄りに感じられたため、基準点を少し右へオフセットしている。
    // 方向ベクトル：右上→左下方向を、鉛直から BEAST_LINE_ANGLE_DEG 度傾けた形で表す。
    const cx = boardW/2 + tsumRadius*BEAST_LINE_X_OFFSET_RATIO, cy = boardH/2;
    const angleRad = BEAST_LINE_ANGLE_DEG * Math.PI/180;
    const dirX = -Math.sin(angleRad), dirY = Math.cos(angleRad); // 右上→左下の帯の向き
    const bandHalf = tsumRadius * BEAST_BAND_HALF_RATIO;
    // ボムも巻き込んで消せるため、!t.isBomb の除外はしない（ghostだけ除外）
    const targets = tsums.filter(t=>{
      if(t.ghost) return false;
      const dx = t.x-cx, dy = t.y-cy;
      const distFromLine = Math.abs(dx*dirY - dy*dirX);
      return distFromLine <= bandHalf;
    });

    showBeastClawAnim(()=>{
      if(targets.length===0){ boardFrozen = false; finishSkill(); return; }

      const effectiveN = targets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
      const bonus = computeScore(targets, effectiveN);
      score += bonus;
      scoreVal.textContent = score.toLocaleString();
      const gainedCoins = coinsForChain(effectiveN);
      coins += gainedCoins;
      coinVal.textContent = coins.toLocaleString();
      if(effectiveN > maxChain) maxChain = effectiveN;
      chainVal.textContent = maxChain;

      const myCount = targets.reduce((sum,t)=> sum + (t.isMine ? (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1) : 0), 0);

      burstSparkles(targets);
      const suckTargets = buildSuckTargets(targets);
      if(gainedCoins>0) burstCoins(targets, gainedCoins);
      showEraseCount(targets, effectiveN);

      popWithWave(targets, {x:cx, y:cy}, 'popping', ()=>{
        boardFrozen = false; // 演出が終わったら盤面の時間を再開
        refillIfNeeded(targets.map(t=>t.x));
        finishSkill();
        checkFeverTrigger();
      }, true, undefined, false, suckTargets);
    });
  }

  // 右上から左下へ、鋭い爪（3本のツメ跡）が画面を引っ掻く演出
  function showBeastClawAnim(onDone){
    const layer = document.createElement('div');
    layer.className = 'beastClawLayer';
    layer.style.setProperty('--beastClawAngle', `${BEAST_LINE_ANGLE_DEG-90}deg`);
    layer.style.setProperty('--clawXOffset', (tsumRadius*BEAST_LINE_X_OFFSET_RATIO)+'px');
    board.appendChild(layer);

    [0,1,2].forEach(i=>{
      const claw = document.createElement('div');
      claw.className = 'beastClawMark';
      claw.style.setProperty('--clawOffset', (i-1)*(tsumRadius*1.5)+'px');
      claw.style.animationDelay = (i*40)+'ms';
      layer.appendChild(claw);
    });

    requestAnimationFrame(()=> layer.classList.add('play'));

    setTimeout(()=>{
      layer.remove();
      onDone && onDone();
    }, BEAST_CLAW_ANIM_MS);

  // ------------------------------------------------------------
  // ダッフィー：フォーチュン・トラペゾイド
  // 盤面上部中央を基準に「上辺が広く下辺が狭い」逆台形の範囲を対象にする。
  // スキル発動2回に1回（duffySkillPhase===0）は、対象を先にマイツムへ変化させてから消去し、
  // もう1回（duffySkillPhase===1）は、変化させずにそのまま同じ範囲を消去する。この2種類が交互に発動する。
  // ------------------------------------------------------------
  const DUFFY_TRAP_TOP_Y_RATIO = 0.25165;    // 逆台形の上辺のy位置（盤面高さに対する比率、0=最上部）
  const DUFFY_TRAP_BOTTOM_Y_RATIO = 0.8815; // 逆台形の下辺のy位置（盤面高さに対する比率）
  const DUFFY_TRAP_TOP_HALF_RATIO = 0.4675; // 上辺の半幅（盤面幅に対する比率）
  const DUFFY_TRAP_BOTTOM_HALF_RATIO = 0.2805; // 下辺の半幅（盤面幅に対する比率）
  const DUFFY_ANIM_MS = 550; // 逆台形が光る演出の時間

  // 与えたy座標における逆台形の許容半幅を求める（範囲外のyなら null）
  function duffyTrapezoidHalfWidthAt(y){
    const topY = boardH*DUFFY_TRAP_TOP_Y_RATIO;
    const bottomY = boardH*DUFFY_TRAP_BOTTOM_Y_RATIO;
    if(y < topY || y > bottomY) return null;
    const topHalf = boardW*DUFFY_TRAP_TOP_HALF_RATIO;
    const bottomHalf = boardW*DUFFY_TRAP_BOTTOM_HALF_RATIO;
    const ratio = (y-topY) / Math.max(1, bottomY-topY); // 0(上辺)〜1(下辺)
    return topHalf + (bottomHalf-topHalf)*ratio;
  }

  function isInDuffyTrapezoid(t){
    const halfW = duffyTrapezoidHalfWidthAt(t.y);
    if(halfW===null) return false;
    const cx = boardW/2;
    return Math.abs(t.x-cx) <= halfW;
  }

  function skillDuffyTrapezoid(){
    // 変化〜消去が終わるまで、盤面の物理演算とゲーム内タイマーを完全に停止する
    boardFrozen = true;

    const isTransformPhase = (duffySkillPhase===0);
    const candidates = tsums.filter(t=> !t.isBomb && !t.ghost && isInDuffyTrapezoid(t));

    if(isTransformPhase){
      // 1回目：逆台形の範囲内にあるサブツムを先にマイツムへ変化させ、その後に同じ範囲を消去する
      pauseTimer(DUFFY_ANIM_MS + 700);
      const myType = TSUM_TYPES.find(t=>t.key===myTsumKey);
      const toTransform = candidates.filter(t=>!t.isMine);

      showDuffyTrapezoidFlash(()=>{
        toTransform.forEach(t=>{
          t.type = myType;
          t.isMine = true;
          const size = t.r*2;
          const newEl = createTsumEl(myType, true, size);
          newEl.style.transform = t.el.style.transform;
          t.el.replaceWith(newEl);
          t.el = newEl;
          attachHandlers(t);
        });
        showSkillLabel(`フォーチュン・トラペゾイド！ ${toTransform.length}個がマイツムに`);
        burstSparkles(toTransform);

        setTimeout(()=>{
          duffyEraseTrapezoid(candidates);
        }, 380);
      });
    } else {
      // 2回目：変化させず、そのまま同じ逆台形の範囲を消去する
      pauseTimer(DUFFY_ANIM_MS + 500);
      showDuffyTrapezoidFlash(()=>{
        duffyEraseTrapezoid(candidates);
      });
    }

    // 次回は逆側のフェーズへ交互に切り替える
    duffySkillPhase = isTransformPhase ? 1 : 0;
  }

  // 逆台形の範囲を実際に消去する共通処理（変化フェーズ・非変化フェーズの両方から呼ばれる）
  function duffyEraseTrapezoid(targets){
    if(targets.length===0){ boardFrozen = false; finishSkill(); return; }

    const effectiveN = targets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    const bonus = computeScore(targets, effectiveN);
    score += bonus;
    scoreVal.textContent = score.toLocaleString();
    const gainedCoins = coinsForChain(effectiveN);
    coins += gainedCoins;
    coinVal.textContent = coins.toLocaleString();
    if(effectiveN > maxChain) maxChain = effectiveN;
    chainVal.textContent = maxChain;

    const myCount = targets.reduce((sum,t)=> sum + (t.isMine ? (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1) : 0), 0);

    burstSparkles(targets);
    const suckTargets = buildSuckTargets(targets);
    if(gainedCoins>0) burstCoins(targets, gainedCoins);
    const eraseCountPos = showEraseCount(targets, effectiveN);

    const spawnBomb = effectiveN >= bombChainThreshold;
    const bombSpot = spawnBomb ? eraseCountPos : null;
    popWithWave(targets, {x:boardW/2, y:boardH*DUFFY_TRAP_TOP_Y_RATIO}, 'popping', ()=>{
      boardFrozen = false;
      refillIfNeeded(targets.map(t=>t.x));
      finishSkill();
      checkFeverTrigger();
    }, true, ()=>{ if(bombSpot) spawnBombAt(bombSpot); }, false, suckTargets);
  }

  // 逆台形の範囲を実際のジオメトリと同じ形（clip-path）で光らせる演出
  function showDuffyTrapezoidFlash(onDone){
    const topY = boardH*DUFFY_TRAP_TOP_Y_RATIO;
    const bottomY = boardH*DUFFY_TRAP_BOTTOM_Y_RATIO;
    const topHalf = boardW*DUFFY_TRAP_TOP_HALF_RATIO;
    const bottomHalf = boardW*DUFFY_TRAP_BOTTOM_HALF_RATIO;
    const cx = boardW/2;

    const layer = document.createElement('div');
    layer.className = 'duffyTrapezoidLayer';
    layer.style.left = (cx-topHalf)+'px';
    layer.style.top = topY+'px';
    layer.style.width = (topHalf*2)+'px';
    layer.style.height = (bottomY-topY)+'px';
    // レイヤー内のローカル座標系（0,0が左上）でclip-pathの台形を組む
    const localTopHalf = topHalf, localBottomHalf = bottomHalf;
    const leftTopX = 0, rightTopX = localTopHalf*2;
    const leftBottomX = localTopHalf-localBottomHalf, rightBottomX = localTopHalf+localBottomHalf;
    layer.style.clipPath = `polygon(${leftTopX}px 0, ${rightTopX}px 0, ${rightBottomX}px 100%, ${leftBottomX}px 100%)`;
    board.appendChild(layer);

    setTimeout(()=>{
      layer.remove();
      onDone && onDone();
    }, DUFFY_ANIM_MS);
  }

  // ------------------------------------------------------------
  // ヒーロースタイルスティッチ<変身>
  // スキル発動のたびに1/3の確率抽選を行う：
  //   通常時／第1形態時：[横ライン消去(2ツム分)] [横ライン消去(3ツム分)] [変身]
  //   第2形態時：常に「左上→右下」の順で直径7ツム分の円形消去×2
  // ------------------------------------------------------------
  const STITCH_ANIM_MS = 480; // ライン・円の光の演出時間

  function skillStitchHero(){
    boardFrozen = true;
    stitchSkillActive = true; // スティッチのスキル演出中は、他ヒーローと違ってツムの物理演算は止めない

    if(stitchStage>=2){
      // 第2段階（赤いマント）：左上→右下の順に直径7ツム分の円形消去を2回行う
      pauseTimer(STITCH_ANIM_MS*2 + 700);
      showSkillLabel('ヒーロー・トランスフォーム！ ファイナルバスター');
      const r1 = {x: boardW*0.28, y: boardH*0.28};
      const r2 = {x: boardW*0.72, y: boardH*0.72};
      stitchCircleErase(r1, ()=>{
        stitchCircleErase(r2, ()=>{
          boardFrozen = false;
          stitchSkillActive = false;
          finishSkill();
          checkFeverTrigger();
        });
      });
      return;
    }

    const roll = Math.floor(Math.random()*3); // 0,1,2 の3分の1抽選
    // 最低保証：第1変身は残り41秒以降、第2変身は残り21秒以降になったら確定で変身させる
    const forceTransform =
      (stitchStage===0 && timeLeft<=41) ||
      (stitchStage===1 && timeLeft<=21);
    if(forceTransform){
      pauseTimer(STITCH_ANIM_MS + 600);
      stitchTransformStage();
      return;
    }
    if(roll===0){
      pauseTimer(STITCH_ANIM_MS + 500);
      showSkillLabel('ヒーロー・トランスフォーム！ 横ライン消去');
      stitchLineErase(2, ()=>{ boardFrozen=false; stitchSkillActive=false; finishSkill(); checkFeverTrigger(); });
    } else if(roll===1){
      pauseTimer(STITCH_ANIM_MS + 500);
      showSkillLabel('ヒーロー・トランスフォーム！ 横ライン消去');
      stitchLineErase(3, ()=>{ boardFrozen=false; stitchSkillActive=false; finishSkill(); checkFeverTrigger(); });
    } else {
      // 変身（消去は行わない）
      pauseTimer(STITCH_ANIM_MS + 600);
      stitchTransformStage();
    }
  }

  // 横一列（縦幅rows分）を光らせてから消去する
  function stitchLineErase(rows, onDone){
    // 横一列の高さは盤面中央に固定（マイツムの位置によって毎回変わらないようにする）
    const bandY = boardH/2;
    const bandHalf = tsumRadius*rows;

    const layer = document.createElement('div');
    layer.className = 'duffyTrapezoidLayer';
    layer.style.left = '0px';
    layer.style.top = (bandY-bandHalf)+'px';
    layer.style.width = boardW+'px';
    layer.style.height = (bandHalf*2)+'px';
    layer.style.clipPath = 'none';
    layer.style.background = 'linear-gradient(180deg, rgba(255,255,255,0.9), rgba(63,169,224,0.4) 60%, transparent 100%)';
    layer.style.boxShadow = '0 0 18px 6px rgba(63,169,224,0.65)';
    board.appendChild(layer);

    setTimeout(()=>{
      layer.remove();
      const targets = tsums.filter(t=> !t.isBomb && !t.ghost && Math.abs(t.y-bandY)<=bandHalf);
      if(targets.length===0){ onDone && onDone(); return; }

      const effectiveN = targets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
      const bonus = computeScore(targets, effectiveN);
      score += bonus;
      scoreVal.textContent = score.toLocaleString();
      const gainedCoins = coinsForChain(effectiveN, TSUM_TYPES.find(t=>t.key==='stitch').coinBonus);
      coins += gainedCoins;
      coinVal.textContent = coins.toLocaleString();
      if(effectiveN > maxChain) maxChain = effectiveN;
      chainVal.textContent = maxChain;

      burstSparkles(targets);
      const suckTargets = buildSuckTargets(targets);
      if(gainedCoins>0) burstCoins(targets, gainedCoins);
      const eraseCountPos = showEraseCount(targets, effectiveN);
      const spawnBomb = effectiveN >= bombChainThreshold;
      const bombSpot = spawnBomb ? eraseCountPos : null;

      popWithWave(targets, null, 'popping', ()=>{
        refillIfNeeded(targets.map(t=>t.x));
        onDone && onDone();
      }, true, ()=>{ if(bombSpot) spawnBombAt(bombSpot); }, false, suckTargets, 0.5);
    }, STITCH_ANIM_MS);
  }

  // 指定座標を中心に直径6ツム分の円形消去を行う（第2段階専用）
  function stitchCircleErase(p, onDone){
    const eraseRadius = tsumRadius*7; // 直径7ツム分の円
    showBuzzTapCircle(p, eraseRadius);

    setTimeout(()=>{
      const targets = tsums.filter(t=>{
        if(t.isBomb || t.ghost) return false;
        const dx = t.x-p.x, dy = t.y-p.y;
        return (dx*dx+dy*dy) <= eraseRadius*eraseRadius;
      });
      if(targets.length===0){ onDone && onDone(); return; }

      const effectiveN = targets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
      const bonus = computeScore(targets, effectiveN);
      score += bonus;
      scoreVal.textContent = score.toLocaleString();
      const gainedCoins = coinsForChain(effectiveN, TSUM_TYPES.find(t=>t.key==='stitch').coinBonus);
      coins += gainedCoins;
      coinVal.textContent = coins.toLocaleString();
      if(effectiveN > maxChain) maxChain = effectiveN;
      chainVal.textContent = maxChain;

      burstSparkles(targets);
      const suckTargets = buildSuckTargets(targets);
      if(gainedCoins>0) burstCoins(targets, gainedCoins);
      const eraseCountPos = showEraseCount(targets, effectiveN);
      const spawnBomb = effectiveN >= bombChainThreshold;
      const bombSpot = spawnBomb ? eraseCountPos : null;

      popWithWave(targets, p, 'popping', ()=>{
        refillIfNeeded(targets.map(t=>t.x));
        onDone && onDone();
      }, true, ()=>{ if(bombSpot) spawnBombAt(bombSpot); }, false, suckTargets, 0.5);
    }, 260);
  }

  // 変身演出：盤面上の（今の姿の）スティッチを全て次の形態の見た目へ差し替える
  function stitchTransformStage(){
    stitchStage = stitchStage + 1;
    const newType = currentStitchType();
    const label = stitchStage>=2 ? '赤いマントを羽織って第2形態に変身！' : '青い水着を着て第1形態に変身！';

    const flash = document.createElement('div');
    flash.className = 'namineTransformFlashLayer';
    flash.style.background = stitchStage>=2
      ? 'radial-gradient(circle, rgba(255,255,255,0.9), rgba(217,75,58,0.35) 60%, transparent 75%)'
      : 'radial-gradient(circle, rgba(255,255,255,0.9), rgba(63,169,224,0.35) 60%, transparent 75%)';
    board.appendChild(flash);
    setTimeout(()=> flash.remove(), 520);

    const targets = tsums.filter(t=> t.isMine && !t.isBomb && !t.ghost &&
      (t.type.key==='stitch' || t.type.key==='stitchForm1' || t.type.key==='stitchForm2'));
    targets.forEach(t=> t.el.classList.add('soraTransforming'));

    showSkillLabel(`ヒーロー・トランスフォーム！ ${label}`);

    setTimeout(()=>{
      targets.forEach(t=> transformTsumType(t, newType));
      if(stitchStage>=2){
        // 第2形態になったら、盤面に残っている赤いかごは（消去ではなく）静かに取り除く
        removeAllRedBaskets();
      }
      boardFrozen = false;
      stitchSkillActive = false;
      finishSkill();
    }, 500);
  }

  // 盤面上の「赤いかご」を、スコア・コイン・チェーン等には一切影響させずに静かに取り除く
  function removeAllRedBaskets(){
    const baskets = tsums.filter(t=> t.type.key==='redbasket' && !t.isBomb && !t.ghost);
    baskets.forEach(t=>{
      t.el.style.transition = 'opacity .35s ease, transform .35s ease';
      t.el.style.opacity = '0';
      t.el.style.transform += ' scale(0.6)';
      const idx = tsums.indexOf(t);
      if(idx>=0) tsums.splice(idx,1);
      setTimeout(()=>{ t.el.remove(); }, 380);
    });
  }

  // ジャックのスキル：サブツム(ジャックとサリー以外)を15個ランダム消去。
  // 発動中は時間停止（＝残り時間タイマーを止めるだけで、ツムの物理は止めない＝boardFrozenにはしない）。
  // サリーの効果時間中に発動した場合は、追加でジャックとサリーを全て消す特別演出になる。
  function skillJackScramble(){
    const comboMode = sallyActive; // サリー効果中に発動した場合は合体演出
    pauseTimer(2600); // 残り時間だけ止める（物理は動き続ける）。ツムが枠内に入るのを待ってからの合体演出をじっくり見せるため長めに確保
    appEl.classList.add('timeStopDimmed'); // 時間停止中であることが分かるよう画面を薄暗くする
    skillTimeFreeze = true; // 発動中はサリーの効果残り時間なども一緒に止める（finishSkillで解除）

    const subCandidates = tsums.filter(t=> !t.isMine && !t.isBomb && !t.ghost && t.type.key!=='jack' && t.type.key!=='sally');
    shuffleArr(subCandidates);
    const targets = subCandidates.slice(0, Math.min(15, subCandidates.length));
    targets.forEach(t=> t.el.classList.add('jackTargetSpotlight')); // 選ばれたツムだけ薄暗くならないようにする

    // ---- ここから下（ランダム消去15個＋補充まで）は、単体発動時とまったく同じロジック ----
    // comboMode の場合は、消去・補充が終わったあと（onRandomEraseDone）に続けて
    // ジャック＆サリー全消去演出へ進む。単体発動時は同じ処理のあとそのままスキルを終了する。
    const finishUp = (allTargets, label, coinsGained, onRandomEraseDone)=>{
      let suckTargets;
      if(allTargets.length>0){
        burstSparkles(allTargets);
        suckTargets = buildSuckTargets(allTargets);
        if(coinsGained>0) burstCoins(allTargets, coinsGained);
      }
      showSkillLabel(label);
      popWithWave(allTargets, {x:boardW/2, y:boardH/2}, 'popping', ()=>{
        refillIfNeeded(allTargets.map(t=>t.x));
        if(onRandomEraseDone){
          onRandomEraseDone();
        } else {
          finishSkill();
          checkFeverTrigger();
        }
      }, true, undefined, false, suckTargets);
    };

    if(targets.length===0 && !comboMode){
      showSkillLabel('ランダムスクランブル！ 対象がいなかった…');
      finishSkill();
      return;
    }

    const effectiveN = targets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    const bonus = computeScore(targets, effectiveN);
    score += bonus;
    scoreVal.textContent = score.toLocaleString();
    const gainedCoins = coinsForChain(effectiveN, 7);
    coins += gainedCoins;
    coinVal.textContent = coins.toLocaleString();
    if(effectiveN > maxChain) maxChain = effectiveN;
    chainVal.textContent = maxChain;
    showEraseCount(targets, effectiveN);

    const label = `ランダムスクランブル！ サブツム${targets.length}個消去 +${bonus}`;

    if(!comboMode){
      finishUp(targets, label, gainedCoins);
      return;
    }

    // ---- 合体演出：単体発動時と同じランダム消去＋補充のあと、続けてジャックとサリーを全て消去する ----
    finishUp(targets, label, gainedCoins, ()=>{
      waitUntilAllSettled(()=>{
        // 待機中に補充されて降ってきたジャック＆サリーも巻き込むため、ここで改めて取得する
        const jackSallyTargets = tsums.filter(t=> t.isMine && !t.isBomb && !t.ghost && (t.type.key==='jack' || t.type.key==='sally'));
        jackSallyTargets.forEach(t=> t.el.classList.add('jackTargetSpotlight')); // ジャック＆サリー本体も薄暗くならないようにする
        if(jackSallyTargets.length===0){
          showSkillLabel(label);
          finishSkill();
          checkFeverTrigger();
          return;
        }

        // 合体前の「寄せられて光る」タメ演出：ジャック＆サリーが一瞬強く発光してから弾ける
        jackSallyTargets.forEach(t=> t.el.classList.add('jackSallyGathering'));
        showJackSallyComboBurst();

        setTimeout(()=>{
          const effectiveN2 = jackSallyTargets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
          const bonus2 = computeScore(jackSallyTargets, effectiveN2);
          score += bonus2;
          scoreVal.textContent = score.toLocaleString();
          const gainedCoins2 = coinsForChain(effectiveN2, 12);
          coins += gainedCoins2;
          coinVal.textContent = coins.toLocaleString();
          if(effectiveN2 > maxChain) maxChain = effectiveN2;
          chainVal.textContent = maxChain;
          showEraseCount(jackSallyTargets, effectiveN2);
          burstSparkles(jackSallyTargets);
          const suckTargets2 = buildSuckTargets(jackSallyTargets);
          if(gainedCoins2>0) burstCoins(jackSallyTargets, gainedCoins2);

          showSkillLabel(`ドリームスクランブル！ サブツム${targets.length}個＋ジャック&サリー${jackSallyTargets.length}個消去`, 'jackSallyLabel');
          // ジャック＆サリーの重ねがけスキルで消えるマイツム（ジャック＆サリー本体）は、
          // スキルゲージへの反映率を0%にする（このスキルではゲージが溜まらない）
          popWithWave(jackSallyTargets, {x:boardW/2, y:boardH/2}, 'popping', ()=>{
            refillIfNeeded(jackSallyTargets.map(t=>t.x));
            finishSkill();
            checkFeverTrigger();
          }, true, undefined, false, suckTargets2, 0);
        }, 700);
      }, 1500);
    });
  }

  // サリーのスキル：効果時間中、少し離れたツムとも繋げられるようになる（リンク距離の拡張はtryAddToSelection側で処理）。
  // ここではスキル発動時の効果開始処理のみを行う。
  function skillSallyStitch(){
    sallyActive = true;
    boardFrozen = true;
    pauseTimer(900);
    appEl.classList.add('timeStopDimmed'); // 発動演出中であることが分かるよう画面を薄暗くし、時間を止める

    setTimeout(()=>{

  // ドリームスティッチ発動の瞬間、盤面に紫の縫い目ラインを数本走らせる演出（サリーの"つぎはぎ"モチーフ）
  function showSallyStitchBurst(){

    for(let i=0;i<LINE_COUNT;i++){

  // サリーの効果中に、サリーを含むチェーンを消したときの専用処理。
  // なぞった順に「たどるアニメーション」を再生（その間は時間停止・物理も停止）した後、
  // なぞった各ツムの周囲も巻き込んで、最後のツムの位置へまとめて一気に消す。
  function resolveSallyChain(path){
    if(!gameActive) return;
    boardFrozen = true;
    pauseTimer(path.length*SALLY_TRACE_STEP_MS + 1100);
    appEl.classList.add('timeStopDimmed'); // たどるアニメーション中であることが分かるよう画面を薄暗くする

    if(selecting){
      selecting=false; selectedPath=[]; ropeSvg.innerHTML=''; linkCountEl.textContent='0'; chainCountBadge.classList.remove('show'); lastPointerPoint=null;
    }

    const traceOne = (i)=>{
      if(i>=path.length){
        setTimeout(()=> finishSallyChain(path), 320);
        return;
      }
      const t = path[i];
      if(tsums.includes(t)) t.el.classList.add('sallyTraced');
      setTimeout(()=> traceOne(i+1), SALLY_TRACE_STEP_MS);
    };
    traceOne(0);
  }

  function finishSallyChain(path){
    const pathIds = new Set(path.map(t=>t.id));
    const baseRadius = tsumRadius * SALLY_GATHER_RANGE;
    const nearbySet = new Set();
    tsums.forEach(t=>{
      if(pathIds.has(t.id) || t.isBomb || t.ghost) return;
      for(const c of path){
        // 大ツムは通常ツムよりサイズが大きい分、巻き込む範囲もそのサイズに見合って広くする
        const radius = c.isBig ? baseRadius * (c.r/tsumRadius) : baseRadius;
        const dx = t.x-c.x, dy = t.y-c.y;
        if(dx*dx+dy*dy <= radius*radius){ nearbySet.add(t); break; }
      }
    });
    const extraTargets = Array.from(nearbySet);
    const pathEffectiveN = path.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    const extraEffectiveN = extraTargets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    const effectiveN = pathEffectiveN + extraEffectiveN;

    const bonus = computeScore(path, pathEffectiveN) + (extraTargets.length>0 ? computeScore(extraTargets, extraEffectiveN) : 0);
    score += bonus;
    scoreVal.textContent = score.toLocaleString();
    const gainedCoins = coinsForChain(effectiveN);
    coins += gainedCoins;
    coinVal.textContent = coins.toLocaleString();
    if(effectiveN > maxChain) maxChain = effectiveN;
    chainVal.textContent = maxChain;

    const allErased = path.concat(extraTargets);
    const myCount = allErased.reduce((sum,t)=> sum + (t.isMine ? (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1) : 0), 0);

    const last = path[path.length-1];
    showCombo(path.length, bonus, allErased, gainedCoins, effectiveN);
    showEraseCount(allErased, effectiveN, last);
    burstSparkles(allErased);
    const suckTargets = buildSuckTargets(allErased);
    if(gainedCoins>0) burstCoins(allErased, gainedCoins);

    allErased.forEach(t=> t.el.classList.remove('selected','namineLinkable','hookLinkable','sallyLinkable','sallyTraced'));

    // 「最後のツムのところにまとめて消える」：最後のツムを中心に一気に（ノーウェーブで）消す
    // サリー単独スキル効果中になぞって消したマイツムは、スキルゲージへの反映率を70%にする
    popWithWave(allErased, {x:last.x, y:last.y}, 'popping', ()=>{
      boardFrozen = false;
      appEl.classList.remove('timeStopDimmed');
      refillIfNeeded(allErased.map(t=>t.x));
      checkFeverTrigger();
    }, true, undefined, false, suckTargets, 0.7);
  }

  function doBuzzErase(p){
    const eraseRadius = tsumRadius*5; // 直径5ツム分の円
    showBuzzTapCircle(p, eraseRadius);

    const targets = tsums.filter(t=>{
      if(t.isBomb || t.ghost) return false;
      const dx = t.x-p.x, dy = t.y-p.y;
      return (dx*dx+dy*dy) <= eraseRadius*eraseRadius;
    });

    buzzTapsLeft--;
    updateBuzzLabel();

    if(targets.length===0){
      if(buzzTapsLeft<=0) endBuzzTapMode();
      return;
    }

    const effectiveN = targets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    const bonus = computeScore(targets, effectiveN);
    score += bonus;
    scoreVal.textContent = score.toLocaleString();
    const gainedCoins = coinsForChain(effectiveN, -1);
    coins += gainedCoins;
    coinVal.textContent = coins.toLocaleString();
    if(effectiveN > maxChain) maxChain = effectiveN;
    chainVal.textContent = maxChain;

    const myCount = targets.reduce((sum,t)=> sum + (t.isMine ? (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1) : 0), 0);

    burstSparkles(targets);
    const suckTargets = buildSuckTargets(targets);
    if(gainedCoins>0) burstCoins(targets, gainedCoins);
    const eraseCountPos = showEraseCount(targets, effectiveN);

    const spawnBomb = effectiveN >= bombChainThreshold;
    const bombSpot = spawnBomb ? eraseCountPos : null;
    popWithWave(targets, p, 'popping', ()=>{
      refillIfNeeded(targets.map(t=>t.x));
      if(buzzTapsLeft<=0) endBuzzTapMode();
    }, true, ()=>{ if(bombSpot) spawnBombAt(bombSpot); }, true, suckTargets, 0.25);
  }

  function updateBuzzLabel(){
    if(buzzTapsLeft>0){
      showSkillLabel(`敵を一掃！ 残り${buzzTapsLeft}回`);
    } else {
      showSkillLabel('ネヴァー・ギブアップ！');
    }
  }

  // ------------------------------------------------------------
  // Bomb
  // ------------------------------------------------------------
  function createBombEl(size){
    const el = document.createElement('div');
    el.className = 'tsum bomb';
    el.style.width = size+'px';
    el.style.height = size+'px';
    const face = document.createElement('div');
    face.className = 'face';
    el.appendChild(face);
    return el;
  }

  function markAsBomb(t){
    t.isBomb = true;
    const size = t.r*2;
    const newEl = createBombEl(size);
    newEl.style.transform = t.el.style.transform;
    t.el.replaceWith(newEl);
    t.el = newEl;
    attachHandlers(t);
  }

  function spawnBombNear(spot){
    // 指定座標に最も近い（まだボムでない）ツムをボム化する
    let best = null, bestD = Infinity;
    for(const t of tsums){
      if(t.isBomb || t.ghost) continue;
      const dx = t.x-spot.x, dy = t.y-spot.y;
      const d = dx*dx+dy*dy;
      if(d < bestD){ bestD = d; best = t; }
    }
    if(best) markAsBomb(best);
  }

  // 既存のツムを流用せず、指定座標にその場でボムを新規生成する。
  // 消去数ラベルの表示位置とボムの出現位置を必ず一致させたい場合に使う。
  function spawnBombAt(spot){
    const t = spawnTsum(spot.x, spot.y, 0, 0, undefined, false);
    markAsBomb(t);
  }

  function detonateBomb(bombTsum){
    if(!gameActive || skillActive) return;
    // ボムの爆発は、盤面上で消去演出待ち（幽霊状態）のツムを強制的に0フレームで消し切り、
    // 詰まっていた落下を即座に再開させる（ボムキャンセル）
    forceFinishAllGhosts();

    const radius = bombTsum.r * 3.2; // 周囲を巻き込む範囲
    const affected = tsums.filter(t=>{
      if(t.ghost || t.isBomb) return false;
      const dx = t.x-bombTsum.x, dy = t.y-bombTsum.y;
      return Math.sqrt(dx*dx+dy*dy) <= radius;
    });
    const n = affected.length;
    if(n===0) return;
    const effectiveN = affected.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    bumpCombo();
    const bonus = computeScore(affected, effectiveN);
    score += bonus;
    scoreVal.textContent = score.toLocaleString();
    const gainedCoins = coinsForChain(effectiveN);
    coins += gainedCoins;
    coinVal.textContent = coins.toLocaleString();
    if(effectiveN > maxChain) maxChain = effectiveN;
    chainVal.textContent = maxChain;

    const myCount = affected.reduce((sum,t)=> sum + (t.isMine ? (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1) : 0), 0);

    comboDisplay.textContent = `ボム爆発！ +${bonus}`;
    comboDisplay.classList.remove('show');
    void comboDisplay.offsetWidth;
    comboDisplay.classList.add('show');

    burstSparkles(affected);
    const suckTargets = buildSuckTargets(affected);
    if(gainedCoins>0) burstCoins(affected, gainedCoins);

    affected.forEach(t=>{
      const suckTo = suckTargets.get(t);
      if(suckTo){
        // その場（現在のtranslate位置）を起点に、ゲージ中心へ向かって縮小しながら移動する
        t.sucking = true;
        t.el.classList.add('suckPopping');
        t.el.style.transition = 'none';
        t.el.style.transform = `translate(${t.x - t.r}px, ${t.y - t.r}px) scale(1)`;
        void t.el.offsetWidth;
        t.el.style.transition = 'transform .3s cubic-bezier(.4,0,.7,1), opacity .3s ease';
        requestAnimationFrame(()=>{
          t.el.style.transform = `translate(${suckTo.x - t.r}px, ${suckTo.y - t.r}px) scale(0.05)`;
          t.el.style.opacity = '0';
        });
      } else {
        t.el.classList.add('bombPopping');
      }
    });
    affected.forEach(t=> removeTsum(t));

    // 発火させたボム自身も、周囲の巻き込み対象とは別に必ず消去する
    bombTsum.el.classList.add('bombPopping');
    removeTsum(bombTsum);

    setTimeout(()=>{
      affected.forEach(t=>{
        t.el.remove();
        // このツムが実際にゲージへ到着した瞬間に、そのツム1個分だけゲージへ加算する
        applyGaugeForOneTsum(t, suckTargets);
      });
      bombTsum.el.remove();
      refillIfNeeded(affected.map(t=>t.x).concat([bombTsum.x]));
      checkFeverTrigger();
    }, 300);
  }

  // ------------------------------------------------------------
  // Effects
  // ------------------------------------------------------------
  // 消去数を表示する。
  // list: 消去されたツムの配列
  // count: 表示する数値
  // endPoint: 指定した場合、そのツムの座標に重ねて表示する（チェーンの終端など）。
  //           省略時は list の座標平均＝「消去したところの中心」から画面中心寄りにオフセットして表示する。
  function showEraseCount(list, count, endPoint){
    if(!list || list.length===0) return null;
    let px, py;
    if(endPoint){
      // チェーンの終端ツムに重ねて表示するので、寄せの計算は不要
      px = endPoint.x; py = endPoint.y;
    } else {
      // 消去された全ツムの座標の平均＝「消去したところの中心」
      let cx = 0, cy = 0;
      for(const t of list){ cx += t.x; cy += t.y; }
      cx /= list.length; cy /= list.length;

      // 画面（盤面）の中心へ向かう方向へ、ツム1個分ほど寄せて表示する。
      // これにより、盤面の端で消したときにラベルが盤面の外へはみ出しにくくなり、
      // 見やすい位置（中心寄り）に表示される。
      const boardCx = boardW/2, boardCy = boardH/2;
      let dx = boardCx - cx, dy = boardCy - cy;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const pull = Math.min(dist, tsumRadius*1.6); // 中心に十分近い場合は寄せすぎない
      if(dist > 0.001){ dx = dx/dist*pull; dy = dy/dist*pull; } else { dx = 0; dy = 0; }
      px = cx+dx; py = cy+dy;
    }

    const label = document.createElement('div');
    label.className = 'eraseCountLabel' + (count>=30 ? ' rainbow' : '');
    label.textContent = count;
    label.style.left = px+'px';
    label.style.top = py+'px';
    board.appendChild(label);
    setTimeout(()=> label.remove(), 800);

    return {x:px, y:py}; // ボム出現位置などを、実際に表示した位置に合わせられるように返す
  }

  function showCombo(n, bonus, path, gainedCoins, effectiveN){
    const displayN = effectiveN!==undefined ? effectiveN : n;
    let label;
    const coinTxt = gainedCoins>0 ? ` (+${gainedCoins}コイン)`:'';
    if(displayN>=bombChainThreshold) label = `ボム出現！ ${displayN}チェーン +${bonus}${coinTxt}`;
    else if(displayN>=5) label = `ナイス！ ${displayN}チェーン +${bonus}${coinTxt}`;
    else label = `${displayN}チェーン +${bonus}${coinTxt}`;
    comboDisplay.textContent = label;
    comboDisplay.classList.remove('show');
    void comboDisplay.offsetWidth;
    comboDisplay.classList.add('show');

    const last = path[path.length-1];
    const txt = document.createElement('div');
    txt.className = 'burstText';
    txt.textContent = '+'+bonus;
    txt.style.left = last.x+'px';
    txt.style.top = last.y+'px';
    txt.style.color = last.type.color;
    txt.style.webkitTextStroke = '2px #fff';

  // 配列から等間隔にn個をサンプリングする（順序は維持）
  function sampleEvenly(arr, n){
    if(arr.length<=n) return arr;
    const result = [];
    const step = arr.length / n;
    for(let i=0;i<n;i++){
      result.push(arr[Math.floor(i*step)]);
    }
    return result;
  }

  function burstSparkles(path){
    // ロングチェーン／ボム巻き込みで一度に大量のツムが対象になると、
    // 1体あたり4個×アニメーションのDOM生成が同フレームで積み重なり重くなるため、
    // 対象数が多いときは間引いて生成数の上限を設ける（見た目の密度はほぼ変わらない）。
    const MAX_SPARKLE_TARGETS = 16;
    const targets = path.length > MAX_SPARKLE_TARGETS
      ? sampleEvenly(path, MAX_SPARKLE_TARGETS)
      : path;
    targets.forEach(t=>{
      for(let i=0;i<4;i++){
        const s = document.createElement('div');
        s.className='sparkle';
        const size = tsumRadius*(0.16+Math.random()*0.16);
        s.style.width = size+'px';
        s.style.height = size+'px';
        s.style.background = i%2===0? '#fff': t.type.color;
        s.style.left = t.x+'px';
        s.style.top = t.y+'px';
        board.appendChild(s);
        const angle = Math.random()*Math.PI*2;
        const dist = tsumRadius*(1.2+Math.random()*1.6);
        const dx = Math.cos(angle)*dist;
        const dy = Math.sin(angle)*dist;
        s.animate([
          { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
          { transform:`translate(${dx-size/2}px, ${dy-size/2}px) scale(0.2)`, opacity:0 }
        ], { duration: 450+Math.random()*150, easing:'cubic-bezier(.2,.6,.4,1)' });
        setTimeout(()=>s.remove(), 620);
      }
    });
  }

  function burstCoins(path, count){
    const showCount = Math.min(count, 6);
    for(let i=0;i<showCount;i++){
      const t = path[i % path.length];
      const coin = document.createElement('div');
      coin.className='coinPop';
      coin.style.left = t.x+'px';
      coin.style.top = t.y+'px';
      board.appendChild(coin);
      const dx = (Math.random()-0.5)*tsumRadius*3;
      coin.animate([
        { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
        { transform:`translate(${dx}px, ${-tsumRadius*3.6}px) scale(0.6)`, opacity:0 }
      ], { duration:600, easing:'cubic-bezier(.2,.6,.3,1)' });
      setTimeout(()=>coin.remove(), 650);
    }
  }

  // ------------------------------------------------------------
  // Refill（消去後、盤面の個数がMAX_TSUMSを下回っていたら上から補充）
  // 中央優先の法則：消えた分は一気に生成し、盤面中央を軸に左右へ並べて1段を作る。
  // 1段に収まらない数が消えたときは、その上にさらに段を重ねていく。
  // ------------------------------------------------------------
  function refillIfNeeded(sourceXs){
    const deficit = MAX_TSUMS - tsums.length;
    if(deficit<=0) return;

    const centerX = boardW/2;
    const spacing = tsumRadius*2; // 1段内でのツム間隔（重なりすぎないように直径ぶん空ける）
    const perRow = Math.max(1, Math.floor(boardW / spacing)); // 1段に並ぶ最大数

    // 画面（盤面の見える範囲＝boardH）の外に確実に隠れる開始位置。
    // 以前は boardH 丸ごと分（画面の高さ全部）も上から降らせていたため、
    // 生成されてから見え始めるまでの待ち時間が長すぎた。
    // ツム直径の数個分だけ画面外に隠せば「上空から降ってくる」演出としては十分なので、
    // その最低限の高さまで開始位置を下げる。
    const startY = -tsumRadius*3;

    for(let i=0;i<deficit;i++){
      const rowIdx = Math.floor(i / perRow);
      const indexInRow = i % perRow;
      // 中央優先：0, +1, -1, +2, -2 ... の順で軸から外側へ広がるオフセットを算出
      const half = Math.ceil(indexInRow/2);
      const offset = (indexInRow % 2 === 0 ? half : -half);
      const rawX = centerX + offset*spacing;
      const x = Math.max(tsumRadius, Math.min(boardW-tsumRadius, rawX));
      // 段が上がるほど、さらに高い画面外から降ってくる
      const y = startY - rowIdx*(tsumRadius*2.2) - Math.random()*tsumRadius*0.6;
      const t = spawnTsum(x, y, (Math.random()-0.5)*20, 0);
      t.el.classList.add('spawning');
      setTimeout(()=>t.el.classList.remove('spawning'), 340);
    }
  }

  // ------------------------------------------------------------
  // Physics simulation loop
  // ------------------------------------------------------------
  function physicsStep(dt){
    // dtは秒単位。大きすぎる場合はクランプ（タブ非アクティブ復帰対策）
    dt = Math.min(dt, 1/30);

    // 1) 重力・移動の積分（選択中／消去演出中のツムは物理演算をスキップし、その場に留まる＝幽霊状態）
    // フィーバー時の重力変化：フィーバー中は重力を強めて落下を速くする
    const gravityNow = inFever ? GRAVITY * FEVER_GRAVITY_MULT : GRAVITY;
    for(const t of tsums){
      if(t.selected || t.ghost) continue;
      // 他のツムに乗っかって静止しているとみなせる場合は重力・移動の積分自体をスキップする。
      //
      // 【設計の経緯】
      // 1. 当初「深い重なりが残っている間は常に重力を止める」処理を入れたところ、
      //    横一列に並んで軽く接触しているだけのツムまで重力が止まってしまい、
      //    重なりが解消されない→重力停止が続く→永久に動かない、というデッドロックになった。
      // 2. そこで重力停止をやめて resting のときだけ止める形に戻したが、
      //    今度は「下に支えがあって深く重なっている最中」のツムにもフル重力がかかり続け、
      //    押し出しの解消より沈み込みが早くて埋もれが再発した。
      //
      // 正しい判定基準は「重なっているかどうか」ではなく「下方向に支え(supportedBelow)があるかどうか」。
      // 支えが無い（横や上でしか接触していない）ツムは自由落下すべきなので通常どおりフル重力をかけ、
      // 支えがある（＝下のツムに乗ろうとしている）ツムだけ、深い重なりの間は重力を弱めて
      // 押し出しソルバーが沈み込みに負けないようにする。
      if(t.resting){
        t.vx = 0; t.vy = 0;
      } else if(t.supportedBelow && t.hasDeepOverlap){
        // 支えの上で深くめり込んでいる最中：重力を弱め、下向きの新規加速を止める。
        // 完全ゼロにはせず既存の速度は残す（横滑りの慣性で自然に隙間へ収まる余地を残す）ため、
        // 「これ以上加速させない」だけに留める。
        t.vy = Math.min(t.vy, 0);
        t.vx *= FRICTION;
        t.x += t.vx*dt;
        t.y += t.vy*dt;
      } else {
        t.vy = Math.min(t.vy + gravityNow*dt, MAX_FALL_SPEED);
        t.vx *= FRICTION;
        t.vy *= 0.995;
        t.x += t.vx*dt;
        t.y += t.vy*dt;
      }
      // 落下中は回転させ、速度がほぼ止まったら着地とみなして回転を落ち着かせる（お互いにぶつかりながら転がる演出）
      const isMoving = Math.abs(t.vx) > 8 || Math.abs(t.vy) > 8;
      t.settled = !isMoving;
      if(!t.settled){
        t.rot += t.rotSpeed*dt;
      } else {
        // 着地後は角度をゆっくり0へ戻して見た目を安定させる
        t.rot *= 0.85;
        if(Math.abs(t.rot) < 0.5) t.rot = 0;
      }
    }

    // 2) 壁・床の境界処理
    for(const t of tsums){
      if(t.x - t.r < 0){ t.x = t.r; t.vx = -t.vx*RESTITUTION; }
      if(t.x + t.r > boardW){ t.x = boardW - t.r; t.vx = -t.vx*RESTITUTION; }
      if(t.y + t.r > floorYAt(t.x)){
        t.y = floorYAt(t.x) - t.r;
        if(t.vy > 0) t.vy = -t.vy*RESTITUTION;
        if(Math.abs(t.vy) < 20) t.vy = 0;
      }
      // 【重要】上端の境界処理は「一度盤面内に入ったことがあるツム」にだけ適用する。
      // refillIfNeeded は演出のため、わざと boardH よりずっと上（画面外上空）にツムを生成し、
      // そこから重力で落ちてくる様子を見せている。だが以前はここで無条件に
      // 「t.y - t.r < 0 なら t.y = t.r にスナップ」させていたため、
      // スポーン直後の次フレームで即座に画面上端へワープしてしまい、
      // 「画面外上空から降ってくる」演出が実質無効化されていた。
      // t.enteredBoard フラグを使い、一度でも画面内(y - r >= 0)に到達したツムだけ
      // 以後は天井として扱う（＝盤面に入ってから上に飛び出すのは防ぐが、降ってくる途中は妨げない）。
      if(!t.enteredBoard){
        if(t.y - t.r >= 0) t.enteredBoard = true;
      } else {
        if(t.y - t.r < 0){ t.y = t.r; if(t.vy<0) t.vy = 0; }
      }
    }

    // 3) ツム同士の円形衝突（資料の「衝突により位置の遊びが発生する」を反映）
    //    空間分割グリッドで近傍ペアのみ抽出してから反復ソルバーで安定させる（全探索O(n^2)を回避し軽量化）
    // 【重要】以前は「盤面が完全に静止している間は衝突解決を丸ごとスキップ」していたが、
    // これだと静止中に生じたわずかな重なりが解消されずに放置され、新しいツムが降ってきて
    // anyActive が再び true になった瞬間に、蓄積した重なりが一気に押し出されて
    // 「いきなりツムが弾き飛ぶ」という現象を引き起こしていた。
    // そのため、静止中でも重なり解消（位置の押し出し）自体は常に行い、
    // 速度に影響する反発・摩擦の適用だけを anyActive の時に限定する。
    const anyActive = tsums.some(t=> t.selected || (!t.ghost && !t.settled));
    const n = tsums.length;
    const ITER = 10; // ツム拡大に伴い密度が上がるため反復回数を増やして押し出しをより安定させる
    // セルサイズは盤面上の最大半径（大ツム＝デカツムを含む）を基準にする。
    // 通常半径だけを基準にすると、大ツム同士の衝突判定距離(最大 r_big*2)がセルサイズを超えてしまい、
    // 隣接1セル分しか見ない近傍探索では検出漏れ（すり抜けて重なった後に急に弾かれ暴れる）が起きるため。
    const maxR = tsumRadius * BIG_TSUM_SCALE;
    const cellSize = maxR*2.2;
    // 「下に支えがあるか」「深い重なりが残っているか」を毎フレーム再判定するため、まずリセットする
    for(const t of tsums){
      t.supportedBelow = (t.y + t.r >= floorYAt(t.x) - 0.5); // 床に接地していればそれ自体が支え
      t.hasDeepOverlap = false;
    }
    {
    for(let iter=0; iter<ITER; iter++){
      // グリッドを毎回組み直す（押し出しでセルを跨ぐ可能性があるため）
      const grid = new Map();
      for(let i=0;i<n;i++){
        const t = tsums[i];
        const cx = Math.floor(t.x/cellSize), cy = Math.floor(t.y/cellSize);
        const key = cx+','+cy;
        let arr = grid.get(key);
        if(!arr){ arr=[]; grid.set(key, arr); }
        arr.push(i);
      }
      const checked = new Set();
      for(let i=0;i<n;i++){
        const a = tsums[i];
        const cx = Math.floor(a.x/cellSize), cy = Math.floor(a.y/cellSize);
        for(let ox=-1; ox<=1; ox++){
          for(let oy=-1; oy<=1; oy++){
            const arr = grid.get((cx+ox)+','+(cy+oy));
            if(!arr) continue;
            for(const j of arr){
              if(j<=i) continue;
              const pairKey = i*100000+j;
              if(checked.has(pairKey)) continue;
              checked.add(pairKey);
              const b = tsums[j];
              // 怒ったフック船長がアニメーション中（斜め切り〜成長演出中）は、
              // 盤面のツムたちと一切干渉しない（押し出しの対象にも支えにもしない）
              if((a===hookAnimGhostRef && hookAnimFreeze) || (b===hookAnimGhostRef && hookAnimFreeze)) continue;
              // noCollide（キャプテンライトイヤーのタップ消去でポップ中のツムなど）は、
              // 自分自身は重力・移動の物理演算を継続させたいが、他のツムとの衝突（押し出し・支え）
              // には一切関与させたくないため、ここでペアごとスキップする。
              // これにより、範囲判定ギリギリで動いているツムも自然に動き続けつつ、
              // 他のツムに対して壁として干渉することもない。
              if(a.noCollide || b.noCollide) continue;
              const dx = b.x - a.x, dy = b.y - a.y;
              let dist = Math.sqrt(dx*dx+dy*dy);
              const minDist = (a.r + b.r) * 1.0;
              if(dist < minDist){
                let nx, ny;
                if(dist < 0.01){
                  // 完全に重なっている場合はランダムな方向へ逃がす
                  const ang = Math.random()*Math.PI*2;
                  nx = Math.cos(ang); ny = Math.sin(ang);
                  dist = 0.01;
                } else {
                  nx = dx/dist; ny = dy/dist;
                }
                const overlapRaw = (minDist - dist);
                // 深い重なり（半径の12%超）が残っている間は、まだ「安定して乗っている」とは言えないため、
                // resting 化を保留して押し出しが働き続けるようにフラグを立てる。
                if(overlapRaw > tsumRadius*0.12){
                  a.hasDeepOverlap = true;
                  b.hasDeepOverlap = true;
                }
                // 【重要】1回の反復で押し出せる量に上限を設ける（クランプ）。
                // これまでは overlap（重なりの深さ）をそのまま一発で押し出していたため、
                // 深くめり込んだ瞬間（新しいツムが降ってきて着地直後など）に
                // 半径に近い量が1フレームでワープするように適用され、
                // 「瞬間移動」「埋もれてから急に飛び出す」の直接原因になっていた。
                // 上限を設けることで、深い重なりは複数フレーム・複数反復に分けてじわじわ解消され、
                // 見た目上なめらかに押し出されるようになる。
                const MAX_PUSH_PER_ITER = tsumRadius * 0.35;
                const overlap = Math.min(overlapRaw, MAX_PUSH_PER_ITER);
                // 選択中（指に固定）／消去演出中（幽霊状態）／resting（積まれて静止済み）のツムは
                // 「押し込まれて動かされない」ように扱う。resting も実質的に固定物とみなすことで、
                // 上から降ってくるツムが積み上がった山を無理やり押しのけて隙間に割り込む、という
                // 不自然な動きを防ぎ、降ってきた側だけが押し返される（＝山の上や横で受け止められる）ようにする。
                const aFixed = !!a.selected || !!a.ghost || !!a.resting;
                const bFixed = !!b.selected || !!b.ghost || !!b.resting;
                if(aFixed && bFixed){
                  // 両方固定（選択中／幽霊／resting）の場合は基本的に何もしないが、
                  // 例外として「両方 resting（選択中でも幽霊でもない）」かつ実際に重なっている場合だけは、
                  // このまま固まって重なりが残り続けるのを防ぐため、ごく少量だけ押し出す救済処理を行う。
                  const bothJustResting = a.resting && b.resting && !a.selected && !a.ghost && !b.selected && !b.ghost;
                  if(bothJustResting){
                    const rescuePush = overlap*0.5;
                    a.x -= nx*rescuePush; a.y -= ny*rescuePush;
                    b.x += nx*rescuePush; b.y += ny*rescuePush;
                  }
                } else if(aFixed){
                  b.x += nx*overlap; b.y += ny*overlap;
                } else if(bFixed){
                  a.x -= nx*overlap; a.y -= ny*overlap;
                } else {
                  const push = overlap/2;
                  a.x -= nx*push; a.y -= ny*push;
                  b.x += nx*push; b.y += ny*push;
                }
                // 簡易反発：押し出し方向の速度成分を減衰させつつ交換（反復ごとの過剰な加速を防ぐため最終反復のみ適用）
                // anyActive が false（盤面が完全に静止）の間は速度をいじらない。
                // 位置の押し出しだけ行うことで、静止中の微小な重なりは音も無くじわっと解消される。
                if(iter === ITER-1){
                  if(anyActive){
                    const relVx = b.vx-a.vx, relVy = b.vy-a.vy;
                    const relDot = relVx*nx+relVy*ny;
                    if(relDot < 0){
                      const impulse = -relDot*COLLISION_DAMPING;
                      if(!aFixed){ a.vx -= nx*impulse*0.5; a.vy -= ny*impulse*0.5; }
                      if(!bFixed){ b.vx += nx*impulse*0.5; b.vy += ny*impulse*0.5; }
                    }
                    // ツム同士の摩擦：接線方向（滑る方向）の相対速度を強めに減衰させる。
                    // これを強くすることで、上から落ちてきたツムが下の山の表面を滑って
                    // 隙間に無理やり入り込む（＝押しのけて重なりを作る）のを防ぎ、
                    // 山の斜面で滑りが止まって素直に乗っかるようにする。
                    const tx = -ny, ty = nx;
                    const relTangent = relVx*tx + relVy*ty;
                    const frictionImpulse = relTangent*TSUM_FRICTION;
                    if(!aFixed){ a.vx += tx*frictionImpulse*0.5; a.vy += ty*frictionImpulse*0.5; }
                    if(!bFixed){ b.vx -= tx*frictionImpulse*0.5; b.vy -= ty*frictionImpulse*0.5; }
                  }
                  // 「乗っかっている」関係を記録する：相手が自分より下(ny>0方向)にいて、
                  // ほぼ真下～斜め下からの接触なら、自分は相手に支えられているとみなす。
                  // これを使って resting 判定（下に支えがあり静止していれば重力積分を止める）を行い、
                  // 重力と押し出しのせめぎ合いによる微振動＝「暴れ」を防ぐ。
                  // ※ anyActive に関わらず常に記録する（静止中でも支持関係は維持されるため）。
                  const SUPPORT_COS = 0.5; // 接触方向が鉛直から60度以内なら支持とみなす
                  if(ny > SUPPORT_COS) a.supportedBelow = true; // b が a の下にいる
                  if(ny < -SUPPORT_COS) b.supportedBelow = true; // a が b の下にいる
                }
              }
            }
          }
        }
      }
      // 境界を反復ごとに再チェック（押し出しで壁の外に出ることがあるため）
      // ※ 上端は enteredBoard（一度盤面内に入ったか）を見て、画面外上空から降ってくる途中の
      //    ツムをここで画面内へワープさせてしまわないようにする（理由は上のコメント参照）。
      for(const t of tsums){
        if(t.x - t.r < 0) t.x = t.r;
        if(t.x + t.r > boardW) t.x = boardW - t.r;
        if(t.y + t.r > floorYAt(t.x)) t.y = floorYAt(t.x) - t.r;
        if(t.enteredBoard && t.y - t.r < 0) t.y = t.r;
      }
    }
    } // end 衝突解決ブロック（常時実行）

    // 3.5) resting（乗っかって静止）判定
    // 「下に支えがある」かつ「ほぼ動いていない」ツムは resting=true にし、
    // 次フレームの重力積分をスキップして完全に静止させる。
    // こうしないと、支えられているツムにも毎フレーム重力がかかり続け、
    // 押し出しとの綱引きで微振動＝「暴れ」が発生し続けてしまう。
    // 【重要】速度だけで判定すると、着地直後でまだ深くめり込んでいる状態でも
    // すぐに resting=true（＝押し出しに対して実質固定）になってしまい、
    // 「埋もれたまま動かない」状態が固定化する原因になっていた。
    // そのため、速度に加えて「他のツムと有意な重なりが残っていないこと」も条件に加える。
    for(const t of tsums){
      if(t.selected || t.ghost) continue;
      const almostStill = Math.abs(t.vx) < 4 && Math.abs(t.vy) < 4;
      t.resting = !!(t.supportedBelow && almostStill && !t.hasDeepOverlap);
    }

    // 4) 選択中のなぞりロープをツムの動きに追従して再描画
    if(selecting && selectedPath.length>0){
      updateRope();
      const last = selectedPath[selectedPath.length-1];
      chainCountBadge.style.left = last.x+'px';
      chainCountBadge.style.top = (last.y-last.r-4)+'px';
    }

    // 5) DOM反映
    for(const t of tsums){
      renderTsumPosition(t);
    }
  }

  // 全てのツムが盤面（枠）内に入るまで待ってからコールバックを呼ぶ（ジャック＆サリー合体演出などで使用）。
  // 補充されたツムは画面外の上方から降ってくるため、enteredBoard フラグ（一度でも枠内に到達したか）で判定する。
  // maxWaitMs で上限を設け、演出が万一詰まっても先へ進めるようにする。
  function waitUntilAllSettled(callback, maxWaitMs){
    const startTime = performance.now();
    const check = ()=>{
      const allInBounds = tsums.every(t=> t.selected || t.ghost || t.enteredBoard);
      if(allInBounds || performance.now()-startTime > (maxWaitMs||2000)){
        callback();
        return;
      }
      requestAnimationFrame(check);
    };
    requestAnimationFrame(check);
  }

  function frameLoop(now){
    if(!lastFrameTime) lastFrameTime = now;
    const dt = (now - lastFrameTime)/1000;
    lastFrameTime = now;
    // 最終決戦フック船長の演出中（hookAnimFreeze）は、ゲーム全体の時間停止(boardFrozen)とは違い、
    // ツムの物理演算（重力・衝突）はそのまま動かし続ける仕様のため、boardFrozenのみで判定する。
    if((!boardFrozen || stitchSkillActive) && !hookPhysicsPause && (gameActive || tsums.some(t=>Math.abs(t.vy)>5))){
      physicsStep(dt);
    }
    // 最終決戦フック船長のスキル効果時間は、演出中（hookAnimFreeze中）や他の時間停止演出
    // （boardFrozen・skillTimeFreeze）の間も経過させない。
    if(hookActive && !hookAnimFreeze && !boardFrozen && !skillTimeFreeze){
      hookRemainingMs -= dt*1000;
      if(hookRemainingMs <= 0){
        hookRemainingMs = 0;
        endHookSkill();
      }
    }
    // フィーバーの残り時間も、フック船長演出中（hookAnimFreeze）やゲーム全体の時間停止(boardFrozen)、
    // その他のスキル演出による時間停止(skillTimeFreeze)の間は経過させない。
    if(inFever && !hookAnimFreeze && !boardFrozen && !skillTimeFreeze){
      feverRemainingMs -= dt*1000;
      if(feverRemainingMs <= 0){
        feverRemainingMs = 0;
        exitFever();
      }
      updateFeverGaugeUI();
    }
    // サリーのスキル効果時間も、他の時間停止演出（hookAnimFreeze・boardFrozen＝ジャックのスキル中やサリー自身の
    // たどるアニメーション中など）の間は経過させない。「時間停止中は効果時間も一緒に止まる」仕様にするため。
    if(sallyActive && !hookAnimFreeze && !boardFrozen && !skillTimeFreeze){
      sallyRemainingMs -= dt*1000;
      if(sallyRemainingMs <= 0){
        sallyRemainingMs = 0;
        endSallySkill();
      }
    }
    // フィーバーゲージは合計で消したツム数のみで増える（時間経過による減衰はしない）
    rafHandle = requestAnimationFrame(frameLoop);
  }

  // ------------------------------------------------------------
  // Deadlock detection & reshuffle（座標ベース：近距離クラスタで判定）
  // ------------------------------------------------------------
  function hasAnyMove(){
    // ナミネ・ソラが盤面にいるなら、両者は距離を問わず必ずつながる特殊ペアなので即座に手ありと判定
    const namineSoraCount = tsums.filter(t=> !t.isBomb && !t.ghost && (t.type.key==='namine' || t.type.key==='sora')).length;
    if(namineSoraCount>=3) return true;

    const visited = new Set();
    for(const start of tsums){
      if(visited.has(start.id) || start.isBomb || start.ghost) continue;
      const stack = [start];
      visited.add(start.id);
      let count = 0;
      const group = [];
      while(stack.length){
        const cur = stack.pop();
        count++;
        group.push(cur);
        for(const other of tsums){
          if(visited.has(other.id) || other.isBomb || other.ghost) continue;
          if(!sameChainType(other.type.key, cur.type.key)) continue;
          if(isNamineSoraPair(other.type.key, cur.type.key)){
            // ナミネ⇄ソラは距離を問わず必ずつながる
            visited.add(other.id);
            stack.push(other);
            continue;
          }
          const dx = other.x-cur.x, dy = other.y-cur.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist <= cur.r*3.4){
            visited.add(other.id);
            stack.push(other);
          }
        }
      }
      if(count>=3) return true;
    }
    return false;
  }

  function ensurePlayable(){
    if(!gameActive || skillActive) return;
    let attempts = 0;
    while(!hasAnyMove() && attempts<20){
      reshuffleTypes();
      attempts++;
    }
  }

  function reshuffleTypes(){
    // 座標は維持したまま色（type）だけをシャッフルする救済措置（ボム対象外）。
    // ナミネのスキル効果中はソラ（およびナミネ自身）の種類が壊れないよう対象から除外する。
    const targets = tsums.filter(t=>!t.isBomb && !t.ghost && t.type.key!=='sora' && t.type.key!=='namine');
    const types = targets.map(t=>t.type);
    for(let i=types.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [types[i], types[j]] = [types[j], types[i]];
    }
    targets.forEach((t, idx)=> transformTsumType(t, types[idx]));
  }

  // ------------------------------------------------------------
  // Grid init（初期配置：上空からランダムに降らせて自然に積もらせる）
  // ------------------------------------------------------------
  function initBoard(){
    board.querySelectorAll('.tsum').forEach(n=>n.remove());
    board.querySelectorAll('.burstText,.sparkle,.coinPop').forEach(n=>n.remove());
    tsums = [];

    const count = MAX_TSUMS;
    // 初期分散を良くするため、擬似的な列に分けてからランダムオフセットを加える
    // （完全ランダムだと偏りが生じ衝突解決の反復負荷が増えるため）
    const perRow = Math.max(3, Math.floor(boardW / (tsumRadius*2.1)));
    for(let i=0;i<count;i++){
      const col = i % perRow;
      const rowIdx = Math.floor(i / perRow);
      const jitterX = (Math.random()-0.5)*tsumRadius*0.6;
      const x = tsumRadius + col*((boardW - tsumRadius*2)/(perRow-1||1)) + jitterX;
      const y = -tsumRadius*2 - rowIdx*(tsumRadius*2.05) - Math.random()*tsumRadius;
      spawnTsum(Math.max(tsumRadius, Math.min(boardW-tsumRadius, x)), y, (Math.random()-0.5)*20, 0, false);
    }
  }

  // 初期落下を高速に収束させてからプレイ開始する（積みあがるまで待つのは体験として悪いため、
  // 開始直後に数百msぶん物理を先送りしてシミュレートしておく）
  function presimulate(totalMs){
    const step = 1/120;
    let remaining = totalMs/1000;
    while(remaining>0){
      physicsStep(step);
      remaining -= step;
    }
  }

  // ------------------------------------------------------------
  // Timer / game flow
  // ------------------------------------------------------------
  function startGame(){
    score = 0; coins = 0; maxChain = 0; feverCount = 0;
    timeLeft = GAME_TIME + (itemExtraTime ? 5 : 0);
    comboCount = 0;
    if(comboTimer) clearTimeout(comboTimer);
    feverGauge = 0; inFever = false; feverRemainingMs = 0;
    skillGauge = 0; skillReady = false; skillActive = false; skillTimeFreeze = false;
    jackGauge = 0; sallyGauge = 0; jackReady = false; sallyReady = false;
    sallyActive = false; sallyRemainingMs = 0;
    sallyAuraLayer.classList.remove('show');
    ghostTimers.forEach(g=> clearTimeout(g.timeoutId));
    ghostTimers = [];
    clearTimeout(feverEndTimer);
    appEl.classList.remove('fever');
    feverLights.classList.remove('show');
    skillRingWrap.classList.remove('ready');
    skillRingWrap2.classList.remove('ready');
    skillRingWrap.style.setProperty('--pct', 0);
    skillRingWrap2.style.setProperty('--pct', 0);
    skillRingWrap2.style.display = isPairMode() ? '' : 'none';

    scoreMultiplier = 1;
    if(scoreMultiplierEndTimer) clearTimeout(scoreMultiplierEndTimer);
    gastonRainActive = false;
    clearTimeout(gastonRainTimer);
    appEl.classList.remove('gastonRain');
    boardFrozen = false;
    stitchSkillActive = false;
    buzzTapMode = false;
    buzzTapsLeft = 0;
    boardWrap.classList.remove('buzzTapMode');
    namineActive = false;
    clearTimeout(namineEndTimer);
    namineTransformedKey = null;
    hookActive = false;
    hookRemainingMs = 0;
    HOOK_ANGRY_INITIAL_R = 0;
    HOOK_BAND_BASE = 0;
    hookAnimFreeze = false;
    hookAnimGhostRef = null;
    duffySkillPhase = 0;
    hookPhysicsPause = false;
    stitchStage = 0;
    appEl.classList.remove('hookAnimDimmed');
    appEl.classList.remove('timeStopDimmed');

    // アイテム反映：盤面のツム種類数／ボム出現チェーン数
    activeTsumTypes = buildActiveTsumTypes(itemFewerTypes ? 4 : 5);
    bombChainThreshold = Math.max(3, BOMB_CHAIN_THRESHOLD - (itemBombMinus1 ? 1 : 0));

    scoreVal.textContent = '0';
    coinVal.textContent = '0';
    chainVal.textContent = '0';
    timeVal.textContent = timeLeft;
    skillRingWrap.style.setProperty('--pct', 0);
    updateFeverGaugeUI();
    timerBox.classList.remove('warn');
    startOverlay.classList.add('hidden');
    resultOverlay.classList.add('hidden');

    renderMyTsumIcon();
    layoutBoard();
    initBoard();
    presimulate(1800);
    ensurePlayable();

    gameActive = true;
    clearInterval(timerHandle);
    clearTimeout(timerResumeTimeout);
    timerHandle = setInterval(tick, 1000);
  }

  function tick(){
    // ゲーム全体の残り時間も、あらゆる時間停止演出（boardFrozen・hookAnimFreeze・skillTimeFreeze）の間は減らさない。
    if(boardFrozen || hookAnimFreeze || skillTimeFreeze) return;
    timeLeft--;
    timeVal.textContent = timeLeft;
    if(timeLeft<=10) timerBox.classList.add('warn');
    if(timeLeft<=0) endGame();
  }

  function endGame(){
    gameActive = false;
    clearInterval(timerHandle);
    clearTimeout(timerResumeTimeout);
    clearTimeout(feverEndTimer);
    boardFrozen = false;
    sallyActive = false; sallyRemainingMs = 0;
    buzzTapMode = false;
    boardWrap.classList.remove('buzzTapMode');
    clearTimeout(namineEndTimer);
    if(comboTimer) clearTimeout(comboTimer);
    if(selecting){
      selectedPath.forEach(t=>t.el.classList.remove('selected','namineLinkable','hookLinkable'));
      selecting=false; selectedPath=[]; ropeSvg.innerHTML=''; chainCountBadge.classList.remove('show');
    }
    appEl.classList.remove('fever');
    feverLights.classList.remove('show');
    sallyAuraLayer.classList.remove('show');
    appEl.classList.remove('timeStopDimmed');
    finalScore.textContent = score.toLocaleString();
    finalChain.textContent = maxChain;
    finalCoin.textContent = coins.toLocaleString();
    finalFever.textContent = feverCount;
    setTimeout(()=>{ resultOverlay.classList.remove('hidden'); }, 400);
  }

  function buildStartPreview(){

    el.style.position='relative';

    titleWrap.appendChild(el);

    charPreview.innerHTML = '';
    TSUM_TYPES.filter(t=>!t.pairHidden).forEach(t=>{
      const col = document.createElement('div');
      col.className = 'charCol';

      const pickEl = createTsumEl(t, false, 46);
      pickEl.style.position='relative';
      pickEl.style.left='0'; pickEl.style.top='0'; pickEl.style.transform='none';
      pickEl.style.width='46px'; pickEl.style.height='46px';
      pickEl.classList.add('charPick');
      if(t.key===myTsumKey) pickEl.classList.add('pickSelected');
      pickEl.addEventListener('click', ()=>{
        myTsumKey = t.key;
        buildStartPreview();
        renderMyTsumIcon();
      });
      col.appendChild(pickEl);

      const label = document.createElement('div');
      label.className='charName';
      label.textContent = t.pairKey ? (t.pairLabel || t.name) : t.name;
      col.appendChild(label);

      charPreview.appendChild(col);
    });

    const heroLabel = heroType.pairKey ? (heroType.pairLabel || heroType.name) : heroType.name;
    skillInfoBox.innerHTML =
      `<div class="skName">${heroLabel}のスキル：${heroType.skillName}</div>`+
      `<div class="skDesc">${heroType.skillDesc}</div>`;
  }

  // ------------------------------------------------------------
  // Events
  // ------------------------------------------------------------
  // キャラ選択 → アイテム選択 → ゲーム開始 の3段階フロー
  startBtn.addEventListener('click', ()=>{
    startOverlay.classList.add('hidden');
    itemOverlay.classList.remove('hidden');
  });
  itemStartBtn.addEventListener('click', ()=>{
    itemOverlay.classList.add('hidden');
    startGame();
  });
  retryBtn.addEventListener('click', ()=>{
    resultOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
    buildStartPreview();
  });

  function toggleItem(el){
    el.classList.toggle('active');
  }
  itemFewerEl.addEventListener('click', ()=>{
    toggleItem(itemFewerEl);
    itemFewerTypes = itemFewerEl.classList.contains('active');
  });
  itemBombEl.addEventListener('click', ()=>{
    toggleItem(itemBombEl);
    itemBombMinus1 = itemBombEl.classList.contains('active');
  });
  itemTimeEl.addEventListener('click', ()=>{
    toggleItem(itemTimeEl);
    itemExtraTime = itemTimeEl.classList.contains('active');
  });
  itemCoinEl.addEventListener('click', (e)=>{
    if(e.target===coinSlider) return;
    toggleItem(itemCoinEl);
    updateCoinMultiplier();
  });
  coinSlider.addEventListener('click', (e)=> e.stopPropagation());
  coinSlider.addEventListener('input', updateCoinMultiplier);

  function updateCoinMultiplier(){
    // スライダー(1〜100) を 1.1倍〜51倍に対応させる
    const v = Number(coinSlider.value);
    const mult = 1.1 + (v-1) * (51 - 1.1) / 99;
    const rounded = Math.round(mult*10)/10;
    coinSliderVal.textContent = `×${rounded}`;
    coinMultiplier = itemCoinEl.classList.contains('active') ? rounded : 1;
  }
  updateCoinMultiplier();

  let resizeTimeout;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(()=>{
      if(boardW>0) layoutBoard();
      if(inFever) buildFeverLights();
    }, 120);
  });

  tsumRadius = 20;
  layoutBoard();
  buildStartPreview();
  renderMyTsumIcon();

  rafHandle = requestAnimationFrame(frameLoop);

})();
</script>
</body>
</html>
