  // 配列から等間隔にn個をサンプリングする（順序は維持）
  function sampleEvenly(arr, n){
    if(arr.length<=n) return arr;
    const result = [];
    const step = arr.length / n;
    for(let i=0;i<n;i++){
      result.push(arr[Math.floor(i*step)]);
    }
    return result;
  }

  function burstSparkles(path){
    // ロングチェーン／ボム巻き込みで一度に大量のツムが対象になると、
    // 1体あたり4個×アニメーションのDOM生成が同フレームで積み重なり重くなるため、
    // 対象数が多いときは間引いて生成数の上限を設ける（見た目の密度はほぼ変わらない）。
    const MAX_SPARKLE_TARGETS = 16;
    const targets = path.length > MAX_SPARKLE_TARGETS
      ? sampleEvenly(path, MAX_SPARKLE_TARGETS)
      : path;
    targets.forEach(t=>{
      for(let i=0;i<4;i++){
        const s = document.createElement('div');
        s.className='sparkle';
        const size = tsumRadius*(0.16+Math.random()*0.16);
        s.style.width = size+'px';
        s.style.height = size+'px';
        s.style.background = i%2===0? '#fff': t.type.color;
        s.style.left = t.x+'px';
        s.style.top = t.y+'px';
        board.appendChild(s);
        const angle = Math.random()*Math.PI*2;
        const dist = tsumRadius*(1.2+Math.random()*1.6);
        const dx = Math.cos(angle)*dist;
        const dy = Math.sin(angle)*dist;
        s.animate([
          { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
          { transform:`translate(${dx-size/2}px, ${dy-size/2}px) scale(0.2)`, opacity:0 }
        ], { duration: 450+Math.random()*150, easing:'cubic-bezier(.2,.6,.4,1)' });
        setTimeout(()=>s.remove(), 620);
      }
    });
  }

  function burstCoins(path, count){
    const showCount = Math.min(count, 6);
    for(let i=0;i<showCount;i++){
      const t = path[i % path.length];
      const coin = document.createElement('div');
      coin.className='coinPop';
      coin.style.left = t.x+'px';
      coin.style.top = t.y+'px';
      board.appendChild(coin);
      const dx = (Math.random()-0.5)*tsumRadius*3;
      coin.animate([
        { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
        { transform:`translate(${dx}px, ${-tsumRadius*3.6}px) scale(0.6)`, opacity:0 }
      ], { duration:600, easing:'cubic-bezier(.2,.6,.3,1)' });
      setTimeout(()=>coin.remove(), 650);
    }
  }

  // ------------------------------------------------------------
  // Refill（消去後、盤面の個数がMAX_TSUMSを下回っていたら上から補充）
  // 中央優先の法則：消えた分は一気に生成し、盤面中央を軸に左右へ並べて1段を作る。
  // 1段に収まらない数が消えたときは、その上にさらに段を重ねていく。
  // ------------------------------------------------------------
  function refillIfNeeded(sourceXs){
    const deficit = MAX_TSUMS - tsums.length;
    if(deficit<=0) return;

    const centerX = boardW/2;
    const spacing = tsumRadius*2; // 1段内でのツム間隔（重なりすぎないように直径ぶん空ける）
    const perRow = Math.max(1, Math.floor(boardW / spacing)); // 1段に並ぶ最大数

    // 画面（盤面の見える範囲＝boardH）の外に確実に隠れる開始位置。
    // 大量消去で複数段になっても、どの段も必ずboardHより上（見えない位置）からスタートさせる。
    const startY = -Math.max(boardH, tsumRadius*3) - tsumRadius*2;

    for(let i=0;i<deficit;i++){
      const rowIdx = Math.floor(i / perRow);
      const indexInRow = i % perRow;
      // 中央優先：0, +1, -1, +2, -2 ... の順で軸から外側へ広がるオフセットを算出
      const half = Math.ceil(indexInRow/2);
      const offset = (indexInRow % 2 === 0 ? half : -half);
      const rawX = centerX + offset*spacing;
      const x = Math.max(tsumRadius, Math.min(boardW-tsumRadius, rawX));
      // 段が上がるほど、さらに高い画面外から降ってくる
      const y = startY - rowIdx*(tsumRadius*2.2) - Math.random()*tsumRadius*0.6;
      const t = spawnTsum(x, y, (Math.random()-0.5)*20, 0);
      t.el.classList.add('spawning');
      setTimeout(()=>t.el.classList.remove('spawning'), 340);
    }
  }

  // ------------------------------------------------------------
  // Physics simulation loop
  // ------------------------------------------------------------
  function physicsStep(dt){
    // dtは秒単位。大きすぎる場合はクランプ（タブ非アクティブ復帰対策）
    dt = Math.min(dt, 1/30);

    // 1) 重力・移動の積分（選択中／消去演出中のツムは物理演算をスキップし、その場に留まる＝幽霊状態）
    // フィーバー時の重力変化：フィーバー中は重力を強めて落下を速くする
    const gravityNow = inFever ? GRAVITY * FEVER_GRAVITY_MULT : GRAVITY;
    for(const t of tsums){
      if(t.selected || t.ghost) continue;
      t.vy = Math.min(t.vy + gravityNow*dt, MAX_FALL_SPEED);
      t.vx *= FRICTION;
      t.vy *= 0.995;
      t.x += t.vx*dt;
      t.y += t.vy*dt;
      // 落下中は回転させ、速度がほぼ止まったら着地とみなして回転を落ち着かせる（お互いにぶつかりながら転がる演出）
      const isMoving = Math.abs(t.vx) > 8 || Math.abs(t.vy) > 8;
      t.settled = !isMoving;
      if(!t.settled){
        t.rot += t.rotSpeed*dt;
      } else {
        // 着地後は角度をゆっくり0へ戻して見た目を安定させる
        t.rot *= 0.85;
        if(Math.abs(t.rot) < 0.5) t.rot = 0;
      }
    }

    // 2) 壁・床の境界処理
    for(const t of tsums){
      if(t.x - t.r < 0){ t.x = t.r; t.vx = -t.vx*RESTITUTION; }
      if(t.x + t.r > boardW){ t.x = boardW - t.r; t.vx = -t.vx*RESTITUTION; }
      if(t.y + t.r > boardH){
        t.y = boardH - t.r;
        if(t.vy > 0) t.vy = -t.vy*RESTITUTION;
        if(Math.abs(t.vy) < 20) t.vy = 0;
      }
      if(t.y - t.r < 0){ t.y = t.r; if(t.vy<0) t.vy = 0; }
    }

    // 3) ツム同士の円形衝突（資料の「衝突により位置の遊びが発生する」を反映）
    //    空間分割グリッドで近傍ペアのみ抽出してから反復ソルバーで安定させる（全探索O(n^2)を回避し軽量化）
    // 盤面が完全に静止していて（誰も動いておらず、指で選択中のツムも無い）場合は衝突解決自体が不要なのでスキップする
    const anyActive = tsums.some(t=> t.selected || (!t.ghost && !t.settled));
    const n = tsums.length;
    const ITER = 7;
    // セルサイズは盤面上の最大半径（大ツム＝デカツムを含む）を基準にする。
    // 通常半径だけを基準にすると、大ツム同士の衝突判定距離(最大 r_big*2)がセルサイズを超えてしまい、
    // 隣接1セル分しか見ない近傍探索では検出漏れ（すり抜けて重なった後に急に弾かれ暴れる）が起きるため。
    const maxR = tsumRadius * BIG_TSUM_SCALE;
    const cellSize = maxR*2.2;
    if(anyActive){
    for(let iter=0; iter<ITER; iter++){
      // グリッドを毎回組み直す（押し出しでセルを跨ぐ可能性があるため）
      const grid = new Map();
      for(let i=0;i<n;i++){
        const t = tsums[i];
        const cx = Math.floor(t.x/cellSize), cy = Math.floor(t.y/cellSize);
        const key = cx+','+cy;
        let arr = grid.get(key);
        if(!arr){ arr=[]; grid.set(key, arr); }
        arr.push(i);
      }
      const checked = new Set();
      for(let i=0;i<n;i++){
        const a = tsums[i];
        const cx = Math.floor(a.x/cellSize), cy = Math.floor(a.y/cellSize);
        for(let ox=-1; ox<=1; ox++){
          for(let oy=-1; oy<=1; oy++){
            const arr = grid.get((cx+ox)+','+(cy+oy));
            if(!arr) continue;
            for(const j of arr){
              if(j<=i) continue;
              const pairKey = i*100000+j;
              if(checked.has(pairKey)) continue;
              checked.add(pairKey);
              const b = tsums[j];
              const dx = b.x - a.x, dy = b.y - a.y;
              let dist = Math.sqrt(dx*dx+dy*dy);
              const minDist = (a.r + b.r) * 1.0;
              if(dist < minDist){
                let nx, ny;
                if(dist < 0.01){
                  // 完全に重なっている場合はランダムな方向へ逃がす
                  const ang = Math.random()*Math.PI*2;
                  nx = Math.cos(ang); ny = Math.sin(ang);
                  dist = 0.01;
                } else {
                  nx = dx/dist; ny = dy/dist;
                }
                const overlap = (minDist - dist);
                // 選択中（指に固定）／消去演出中（幽霊状態）のツムは動かさない。相手だけ押し出す。
                const aFixed = !!a.selected || !!a.ghost, bFixed = !!b.selected || !!b.ghost;
                if(aFixed && bFixed){
                  // 両方固定なら何もしない
                } else if(aFixed){
                  b.x += nx*overlap; b.y += ny*overlap;
                } else if(bFixed){
                  a.x -= nx*overlap; a.y -= ny*overlap;
                } else {
                  const push = overlap/2;
                  a.x -= nx*push; a.y -= ny*push;
                  b.x += nx*push; b.y += ny*push;
                }
                // 簡易反発：押し出し方向の速度成分を減衰させつつ交換（反復ごとの過剰な加速を防ぐため最終反復のみ適用）
                if(iter === ITER-1){
                  const relVx = b.vx-a.vx, relVy = b.vy-a.vy;
                  const relDot = relVx*nx+relVy*ny;
                  if(relDot < 0){
                    const impulse = -relDot*COLLISION_DAMPING;
                    if(!aFixed){ a.vx -= nx*impulse*0.5; a.vy -= ny*impulse*0.5; }
                    if(!bFixed){ b.vx += nx*impulse*0.5; b.vy += ny*impulse*0.5; }
                  }
                  // ツム同士の摩擦：接線方向（滑る方向）の相対速度も少し減衰させる
                  const tx = -ny, ty = nx;
                  const relTangent = relVx*tx + relVy*ty;
                  const frictionImpulse = relTangent*TSUM_FRICTION;
                  if(!aFixed){ a.vx += tx*frictionImpulse*0.5; a.vy += ty*frictionImpulse*0.5; }
                  if(!bFixed){ b.vx -= tx*frictionImpulse*0.5; b.vy -= ty*frictionImpulse*0.5; }
                }
              }
            }
          }
        }
      }
      // 境界を反復ごとに再チェック（押し出しで壁の外に出ることがあるため）
      for(const t of tsums){
        if(t.x - t.r < 0) t.x = t.r;
        if(t.x + t.r > boardW) t.x = boardW - t.r;
        if(t.y + t.r > boardH) t.y = boardH - t.r;
        if(t.y - t.r < 0) t.y = t.r;
      }
    }
    } // end if(anyActive)

    // 4) 選択中のなぞりロープをツムの動きに追従して再描画
    if(selecting && selectedPath.length>0){
      updateRope();
      const last = selectedPath[selectedPath.length-1];
      chainCountBadge.style.left = last.x+'px';
      chainCountBadge.style.top = (last.y-last.r-4)+'px';
    }

    // 5) DOM反映
    for(const t of tsums){
      renderTsumPosition(t);
    }
  }

  function frameLoop(now){
    if(!lastFrameTime) lastFrameTime = now;
    const dt = (now - lastFrameTime)/1000;
    lastFrameTime = now;
    if(!boardFrozen && (gameActive || tsums.some(t=>Math.abs(t.vy)>5))){
      physicsStep(dt);
    }
    // フィーバーゲージは合計で消したツム数のみで増える（時間経過による減衰はしない）
    rafHandle = requestAnimationFrame(frameLoop);
  }

  // ------------------------------------------------------------
  // Deadlock detection & reshuffle（座標ベース：近距離クラスタで判定）
  // ------------------------------------------------------------
  function hasAnyMove(){
    // ナミネ・ソラが盤面にいるなら、両者は距離を問わず必ずつながる特殊ペアなので即座に手ありと判定
    const namineSoraCount = tsums.filter(t=> !t.isBomb && !t.ghost && (t.type.key==='namine' || t.type.key==='sora')).length;
    if(namineSoraCount>=3) return true;

    const visited = new Set();
    for(const start of tsums){
      if(visited.has(start.id) || start.isBomb || start.ghost) continue;
      const stack = [start];
      visited.add(start.id);
      let count = 0;
      const group = [];
      while(stack.length){
        const cur = stack.pop();
        count++;
        group.push(cur);
        for(const other of tsums){
          if(visited.has(other.id) || other.isBomb || other.ghost) continue;
          if(!sameChainType(other.type.key, cur.type.key)) continue;
          if(isNamineSoraPair(other.type.key, cur.type.key)){
            // ナミネ⇄ソラは距離を問わず必ずつながる
            visited.add(other.id);
            stack.push(other);
            continue;
          }
          const dx = other.x-cur.x, dy = other.y-cur.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist <= cur.r*3.4){
            visited.add(other.id);
            stack.push(other);
          }
        }
      }
      if(count>=3) return true;
    }
    return false;
  }

  function ensurePlayable(){
    if(!gameActive || skillActive) return;
    let attempts = 0;
    while(!hasAnyMove() && attempts<20){
      reshuffleTypes();
      attempts++;
    }
  }

  function reshuffleTypes(){
    // 座標は維持したまま色（type）だけをシャッフルする救済措置（ボム対象外）。
    // ナミネのスキル効果中はソラ（およびナミネ自身）の種類が壊れないよう対象から除外する。
    const targets = tsums.filter(t=>!t.isBomb && !t.ghost && t.type.key!=='sora' && t.type.key!=='namine');
    const types = targets.map(t=>t.type);
    for(let i=types.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [types[i], types[j]] = [types[j], types[i]];
    }
    targets.forEach((t, idx)=> transformTsumType(t, types[idx]));
  }

  // ------------------------------------------------------------
  // Grid init（初期配置：上空からランダムに降らせて自然に積もらせる）
  // ------------------------------------------------------------
  function initBoard(){
    board.querySelectorAll('.tsum').forEach(n=>n.remove());
    board.querySelectorAll('.burstText,.sparkle,.coinPop').forEach(n=>n.remove());
    tsums = [];

    const count = MAX_TSUMS;
    // 初期分散を良くするため、擬似的な列に分けてからランダムオフセットを加える
    // （完全ランダムだと偏りが生じ衝突解決の反復負荷が増えるため）
    const perRow = Math.max(3, Math.floor(boardW / (tsumRadius*2.1)));
    for(let i=0;i<count;i++){
      const col = i % perRow;
      const rowIdx = Math.floor(i / perRow);
      const jitterX = (Math.random()-0.5)*tsumRadius*0.6;
      const x = tsumRadius + col*((boardW - tsumRadius*2)/(perRow-1||1)) + jitterX;
      const y = -tsumRadius*2 - rowIdx*(tsumRadius*2.05) - Math.random()*tsumRadius;
      spawnTsum(Math.max(tsumRadius, Math.min(boardW-tsumRadius, x)), y, (Math.random()-0.5)*20, 0, false);
    }
  }

  // 初期落下を高速に収束させてからプレイ開始する（積みあがるまで待つのは体験として悪いため、
  // 開始直後に数百msぶん物理を先送りしてシミュレートしておく）
  function presimulate(totalMs){
    const step = 1/120;
    let remaining = totalMs/1000;
    while(remaining>0){
      physicsStep(step);
      remaining -= step;
    }
  }

  // ------------------------------------------------------------
  // Timer / game flow
  // ------------------------------------------------------------
  function startGame(){
    score = 0; coins = 0; maxChain = 0; feverCount = 0;
    timeLeft = GAME_TIME + (itemExtraTime ? 5 : 0);
    comboCount = 0;
    if(comboTimer) clearTimeout(comboTimer);
    feverGauge = 0; inFever = false;
    skillGauge = 0; skillReady = false; skillActive = false; skillGaugeCarry = 0;
    ghostTimers.forEach(g=> clearTimeout(g.timeoutId));
    ghostTimers = [];
    clearTimeout(feverEndTimer);
    appEl.classList.remove('fever');
    feverLights.classList.remove('show');
    skillBtn.classList.remove('ready');

    scoreMultiplier = 1;
    if(scoreMultiplierEndTimer) clearTimeout(scoreMultiplierEndTimer);
    gastonRainActive = false;
    clearTimeout(gastonRainTimer);
    appEl.classList.remove('gastonRain');
    boardFrozen = false;
    buzzTapMode = false;
    buzzTapsLeft = 0;
    boardWrap.classList.remove('buzzTapMode');
    namineActive = false;
    clearTimeout(namineEndTimer);
    namineTransformedKey = null;

    // アイテム反映：盤面のツム種類数／ボム出現チェーン数
    activeTsumTypes = buildActiveTsumTypes(itemFewerTypes ? 4 : 5);
    bombChainThreshold = Math.max(3, BOMB_CHAIN_THRESHOLD - (itemBombMinus1 ? 1 : 0));

    scoreVal.textContent = '0';
    coinVal.textContent = '0';
    chainVal.textContent = '0';
    timeVal.textContent = timeLeft;
    skillFill.style.width = '0%';
    timerBox.classList.remove('warn');
    startOverlay.classList.add('hidden');
    resultOverlay.classList.add('hidden');

    renderMyTsumIcon();
    layoutBoard();
    initBoard();
    presimulate(1800);
    ensurePlayable();

    gameActive = true;
    clearInterval(timerHandle);
    clearTimeout(timerResumeTimeout);
    timerHandle = setInterval(tick, 1000);
  }

  function tick(){
    timeLeft--;
    timeVal.textContent = timeLeft;
    if(timeLeft<=10) timerBox.classList.add('warn');
    if(timeLeft<=0) endGame();
  }

  function endGame(){
    gameActive = false;
    clearInterval(timerHandle);
    clearTimeout(timerResumeTimeout);
    clearTimeout(feverEndTimer);
    boardFrozen = false;
    buzzTapMode = false;
    boardWrap.classList.remove('buzzTapMode');
    clearTimeout(namineEndTimer);
    if(comboTimer) clearTimeout(comboTimer);
    if(selecting){
      selectedPath.forEach(t=>t.el.classList.remove('selected','namineLinkable'));
      selecting=false; selectedPath=[]; ropeSvg.innerHTML=''; chainCountBadge.classList.remove('show');
    }
    appEl.classList.remove('fever');
    feverLights.classList.remove('show');
    finalScore.textContent = score.toLocaleString();
    finalChain.textContent = maxChain;
    finalCoin.textContent = coins.toLocaleString();
    finalFever.textContent = feverCount;
    setTimeout(()=>{ resultOverlay.classList.remove('hidden'); }, 400);
  }

  // ------------------------------------------------------------
  // My-tsum selection UI (start screen)
  // ------------------------------------------------------------
  function renderMyTsumIcon(){
    myTsumIcon.innerHTML = '';
    const type = TSUM_TYPES.find(t=>t.key===myTsumKey);
    const el = createTsumEl(type, true, 44);
    el.style.position='relative'; el.style.left='0'; el.style.top='0'; el.style.transform='none';
    el.style.pointerEvents='none';
    myTsumIcon.appendChild(el);
  }

  function buildStartPreview(){
    const titleWrap = document.getElementById('startTitleTsum');
    const heroType = TSUM_TYPES.find(t=>t.key===myTsumKey);
    titleWrap.innerHTML = '';
    const el = createTsumEl(heroType, true, 76);
    el.style.position='relative';
    el.style.left='0'; el.style.top='0'; el.style.transform='none';
    titleWrap.appendChild(el);

    charPreview.innerHTML = '';
    TSUM_TYPES.forEach(t=>{
      const col = document.createElement('div');
      col.className = 'charCol';

      const pickEl = createTsumEl(t, false, 46);
      pickEl.style.position='relative';
      pickEl.style.left='0'; pickEl.style.top='0'; pickEl.style.transform='none';
      pickEl.style.width='46px'; pickEl.style.height='46px';
      pickEl.classList.add('charPick');
      if(t.key===myTsumKey) pickEl.classList.add('pickSelected');
      pickEl.addEventListener('click', ()=>{
        myTsumKey = t.key;
        buildStartPreview();
        renderMyTsumIcon();
      });
      col.appendChild(pickEl);

      const label = document.createElement('div');
      label.className='charName';
      label.textContent = t.name;
      col.appendChild(label);

      charPreview.appendChild(col);
    });

    skillInfoBox.innerHTML =
      `<div class="skName">${heroType.name}のスキル：${heroType.skillName}</div>`+
      `<div class="skDesc">${heroType.skillDesc}</div>`;
  }

  // ------------------------------------------------------------
  // Events
  // ------------------------------------------------------------
  // キャラ選択 → アイテム選択 → ゲーム開始 の3段階フロー
  startBtn.addEventListener('click', ()=>{
    startOverlay.classList.add('hidden');
    itemOverlay.classList.remove('hidden');
  });
  itemStartBtn.addEventListener('click', ()=>{
    itemOverlay.classList.add('hidden');
    startGame();
  });
  retryBtn.addEventListener('click', ()=>{
    resultOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
    buildStartPreview();
  });

  function toggleItem(el){
    el.classList.toggle('active');
  }
  itemFewerEl.addEventListener('click', ()=>{
    toggleItem(itemFewerEl);
    itemFewerTypes = itemFewerEl.classList.contains('active');
  });
  itemBombEl.addEventListener('click', ()=>{
    toggleItem(itemBombEl);
    itemBombMinus1 = itemBombEl.classList.contains('active');
  });
  itemTimeEl.addEventListener('click', ()=>{
    toggleItem(itemTimeEl);
    itemExtraTime = itemTimeEl.classList.contains('active');
  });
  itemCoinEl.addEventListener('click', (e)=>{
    if(e.target===coinSlider) return;
    toggleItem(itemCoinEl);
    updateCoinMultiplier();
  });
  coinSlider.addEventListener('click', (e)=> e.stopPropagation());
  coinSlider.addEventListener('input', updateCoinMultiplier);

  function updateCoinMultiplier(){
    // スライダー(1〜100) を 1.1倍〜51倍に対応させる
    const v = Number(coinSlider.value);
    const mult = 1.1 + (v-1) * (51 - 1.1) / 99;
    const rounded = Math.round(mult*10)/10;
    coinSliderVal.textContent = `×${rounded}`;
    coinMultiplier = itemCoinEl.classList.contains('active') ? rounded : 1;
  }
  updateCoinMultiplier();

  let resizeTimeout;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(()=>{
      if(boardW>0) layoutBoard();
      if(inFever) buildFeverLights();
    }, 120);
  });

  tsumRadius = 20;
  layoutBoard();
  buildStartPreview();
  renderMyTsumIcon();

  rafHandle = requestAnimationFrame(frameLoop);

})();
</script>
