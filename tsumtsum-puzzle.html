<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>まるまるパズル</title>
<style>
  :root{
    --bg-top:#5fd0f0;
    --bg-bottom:#2fa8dc;
    --panel:#ffffffcc;
    --ink:#4a3b5c;
    --accent-pink:#ff6fa5;
    --accent-purple:#9b6bff;
    --accent-yellow:#ffd23f;
    --accent-mint:#4fd6c4;
    --accent-blue:#4f9dff;
    --accent-orange:#ff9640;
    --rope:#ff4fa0;
    --fever-gold:#ffcc33;
    --shadow: 0 6px 0 rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Hiragino Maru Gothic ProN','Rounded Mplus 1c','Yu Gothic',sans-serif;
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-bottom) 100%);
    touch-action:none;
    color:var(--ink);
  }
  /* #app は常に 480:900（横:縦）の固定比率で表示する。
     画面の縦横比がこれと異なる場合は、はみ出す方向を basis に、
     もう一方をその比率に合わせて縮小し、余白は body の水色背景をそのまま延長して見せる。 */
  #appOuter{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-bottom) 100%);
  }
  #app{
    position:relative;
    width:480px;
    height:900px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-bottom) 100%);
    box-shadow:0 0 40px rgba(80,40,100,0.25);
    overflow:hidden;
    transition:background .5s ease, filter .3s ease;
  }
  #app.fever{
    background:#000;
  }
  #app.gastonRain{
    background:linear-gradient(180deg,#ff9a3d 0%, #d9660f 100%);
  }

  /* ---------- フィーバー中のゲーミングイルミネーション枠 ---------- */
  #feverLights{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:12;
    opacity:0;
    transition:opacity .4s ease;
  }
  #feverLights.show{ opacity:1; }
  #feverLights .bulb{
    position:absolute;
    width:9px; height:9px;
    border-radius:50%;
    margin:-4.5px 0 0 -4.5px;
    box-shadow:0 0 6px 2px currentColor, 0 0 2px 1px #fff;
    background:radial-gradient(circle at 35% 30%, #fff, currentColor 70%);
    animation:bulbTwinkle 1s ease-in-out infinite;
  }
  @keyframes bulbTwinkle{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.35; transform:scale(0.78); }
  }

  /* ---------- HUD ---------- */
  #hud{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px 6px;
    z-index:20;
    position:relative;
    gap:10px;
  }
  .hud-value{
    font-weight:900;
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  #timerBox{
    width:54px; height:54px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eaf7ff, #bfe6fb 60%, #8fd0f0 100%);
    box-shadow:0 3px 0 rgba(20,90,120,0.35), inset 0 -4px 6px rgba(20,90,120,0.15), inset 0 3px 4px rgba(255,255,255,0.8), 0 0 0 3px rgba(255,255,255,0.6);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:background .3s ease;
  }
  #timerBox .hud-value{ color:#2a6f8f; font-size:22px; }
  #timerBox.warn{ background:radial-gradient(circle at 35% 30%, #fff0ea, #ffc9b0 60%, #ff8f6b 100%); }
  #timerBox.warn .hud-value{ color:#ff2d55; animation:pulse .5s infinite; }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }

  #scorePill{
    flex:1;
    min-width:0;
    background:linear-gradient(180deg,#3b6fd6,#2a52ab);
    border-radius:26px;
    padding:8px 18px;
    text-align:center;
    box-shadow:0 3px 0 rgba(15,35,90,0.4), inset 0 2px 3px rgba(255,255,255,0.25), 0 0 0 3px rgba(255,255,255,0.5);
  }
  #scorePill .hud-value{ color:#fff; font-size:24px; letter-spacing:0.5px; }
  #coinRow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:13px;
    font-weight:800;
    color:#ffe9a8;
    margin-top:2px;
  }
  #coinRow .coinIcon{
    width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6c0, #ffd23f 55%, #e0ac00 100%);
    display:inline-block;
    box-shadow:0 0 0 1.5px rgba(255,255,255,0.5);
  }

  #pauseBtn{
    width:56px; height:56px;
    border-radius:50%;
    border:none;
    flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #ffe27a, #ffb400 65%, #e08600 100%);
    box-shadow:0 3px 0 #a86400, inset 0 2px 3px rgba(255,255,255,0.5), 0 0 0 3px rgba(255,255,255,0.5);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #pauseBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #a86400, inset 0 2px 3px rgba(255,255,255,0.5), 0 0 0 3px rgba(255,255,255,0.5); }
  .pauseBars{
    position:relative;
    width:16px; height:16px;
  }
  .pauseBars::before, .pauseBars::after{
    content:'';
    position:absolute;
    top:0; width:5px; height:16px;
    background:#7a4a00;
    border-radius:2px;
  }
  .pauseBars::before{ left:2px; }
  .pauseBars::after{ right:2px; }

  #comboDisplay{
    position:absolute;
    top:96px; left:50%;
    transform:translateX(-50%) scale(0.5);
    font-size:14px;
    font-weight:900;
    background:linear-gradient(135deg,var(--accent-yellow),var(--accent-orange));
    color:#7a3e00;
    padding:4px 16px;
    border-radius:20px;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
    opacity:0;
    z-index:30;
    pointer-events:none;
    white-space:nowrap;
  }
  #comboDisplay.show{
    animation:comboPop .7s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes comboPop{
    0%{opacity:0; transform:translateX(-50%) scale(0.3) rotate(-8deg);}
    15%{opacity:1; transform:translateX(-50%) scale(1.25) rotate(3deg);}
    30%{transform:translateX(-50%) scale(1) rotate(0deg);}
    80%{opacity:1; transform:translateX(-50%) scale(1) rotate(0deg);}
    100%{opacity:0; transform:translateX(-50%) scale(0.9) translateY(-10px);}
  }

  #feverBanner{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.3);
    font-size:38px;
    font-weight:900;
    color:var(--fever-gold);
    -webkit-text-stroke:3px #a05a00;
    paint-order:stroke fill;
    z-index:60;
    opacity:0;
    pointer-events:none;
    letter-spacing:2px;
  }
  #feverBanner.show{
    animation:feverPop 1s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes feverPop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(0.2) rotate(-10deg);}
    25%{opacity:1; transform:translate(-50%,-50%) scale(1.3) rotate(4deg);}
    45%{transform:translate(-50%,-50%) scale(1) rotate(0deg);}
    80%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1) translateY(-20px);}
  }

  /* ---------- board ---------- */
  #boardWrap{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 14px;
    min-height:0;
    overflow:hidden;
  }
  #boardFrame{
    position:absolute;
    inset:6px 10px;
    border-radius:36px 36px 50% 50% / 36px 36px 30% 30%;
    background:radial-gradient(ellipse at 50% 20%, #2c4468 0%, #16233a 75%);
    box-shadow:inset 0 6px 14px rgba(0,0,0,0.45), 0 4px 0 rgba(0,0,0,0.15), 0 0 0 6px rgba(255,255,255,0.55), 0 0 0 9px rgba(20,120,170,0.5);
    z-index:0;
    pointer-events:none;
    transition:background .35s ease;
  }
  /* サリーのスキル効果時間中：枠内の背景を暗い灰色にして「効果中」を分かりやすくする */
  #app.sallySkillActive #boardFrame{
    background:radial-gradient(ellipse at 50% 20%, #4a4a4f 0%, #232326 75%);
  }
  #board{
    position:absolute;
    inset:6px 10px;
    touch-action:none;
    z-index:1;
  }
  /* 最終決戦フック船長：斜め切り〜成長アニメーション中、盤面全体を薄暗くする演出。
     怒ったフック船長自身は class="hookSpotlight" を付与して、このオーバーレイより
     手前(z-index)に表示することで、暗くならず明るいまま浮き上がって見えるようにする。 */
  #board::after{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    opacity:0;
    pointer-events:none;
    z-index:56;
    transition:opacity 0.25s ease;
  }
  #app.hookAnimDimmed #board::after, #app.timeStopDimmed #board::after{
    opacity:1;
  }
  #app.hookAnimDimmed .tsum.hookSpotlight{
    position:relative;
    z-index:57;
  }
  /* ジャックのランダム消去・ジャック＆サリー合体スキル中：選ばれたツムだけ薄暗くならないよう浮き上がらせる */
  #app.timeStopDimmed .tsum.jackTargetSpotlight{
    position:relative;
    z-index:57;
  }
  svg#ropeSvg{
    position:absolute;
    top:0; left:0;
    pointer-events:none;
    z-index:15;
  }
  .tsum{
    position:absolute;
    top:0; left:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    will-change:transform;
    user-select:none;
  }
  .tsum .face{
    width:100%; height:100%;
    border-radius:50%;
    position:relative;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.15), inset 0 5px 8px rgba(255,255,255,0.5), 0 4px 6px rgba(0,0,0,0.15);
    transition:transform .08s ease;
    overflow:visible;
  }
  .tsum.selected .face{
    transform:scale(1.14);
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.15), inset 0 5px 8px rgba(255,255,255,0.5), 0 0 0 4px #fff, 0 0 0 7px var(--rope), 0 4px 10px rgba(0,0,0,0.2);
  }
  .tsum.mytsum .face{
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.15), inset 0 5px 8px rgba(255,255,255,0.5), 0 0 0 3px #fff8, 0 4px 8px rgba(0,0,0,0.2);
  }
  .eye{
    position:absolute;
    background:#3a2b1a;
    border-radius:50%;
  }
  .cheek{
    position:absolute;
    background:rgba(255,255,255,0.55);
    border-radius:50%;
  }
  .motif{
    position:absolute;
    pointer-events:none;
  }
  .tsum.popping{
    animation:popOut .42s ease-out forwards;
    z-index:25;
  }
  @keyframes popOut{
    0%{transform:scale(1); opacity:0.2;}
    40%{transform:scale(1.35); opacity:0.2;}
    100%{transform:scale(0); opacity:0;}
  }
  .tsum.bombPopping{
    animation:bombPopOut .4s ease-out forwards;
    z-index:26;
  }
  @keyframes bombPopOut{
    0%{transform:scale(1); opacity:0.2;}
    30%{transform:scale(1.5); opacity:0.2;}
    100%{transform:scale(0) rotate(180deg); opacity:0;}
  }
  .tsum.spawning{
    animation:spawnDrop .32s cubic-bezier(.3,1.4,.6,1);
  }
  .tsum.bigTsum .face{
    box-shadow: inset 0 -8px 14px rgba(0,0,0,0.18), inset 0 6px 10px rgba(255,255,255,0.55), 0 0 0 3px #fff9, 0 0 16px 4px rgba(255,210,80,0.55), 0 6px 10px rgba(0,0,0,0.22);
  }
  @keyframes spawnDrop{
    0%{opacity:1; transform-origin:center; filter:brightness(1.15);}
    100%{opacity:1; filter:brightness(1);}
  }
  .myOrb{
    position:absolute;
    width:14px; height:14px;
    margin:-7px 0 0 -7px;
    border-radius:50%;
    background: radial-gradient(circle, #ffffff, #ffe27a 55%, #ffb400 100%);
    box-shadow:0 0 10px 3px rgba(255,205,80,0.8);
    pointer-events:none;
    z-index:40;
    transition: transform .5s cubic-bezier(.2,.7,.3,1), opacity .5s ease;
  }
  /* マイツム／サブツムが消えるとき、ツム本体がスキルゲージ or フィーバーゲージへ
     直接吸い込まれていくように移動しながら縮小するポップ演出。
     実際のtransform/transitionはJS側（popWithWave）で直接設定する
     （renderTsumPositionが管理する通常のtranslate(x-r,y-r)と衝突しないようにするため）。 */
  .tsum.suckPopping{
    z-index:27;
    pointer-events:none;
  }

  /* ---------- ナミネ：ソラへの変化演出＆特殊リンク見た目 ---------- */
  .tsum.soraTransforming .face{
    animation: soraTransformFlash .5s ease-in-out;
  }
  @keyframes soraTransformFlash{
    0%{ filter:brightness(1); transform:scale(1); }
    35%{ filter:brightness(2.6) saturate(0); transform:scale(1.22); }
    60%{ filter:brightness(1.8) saturate(0.3); transform:scale(0.92); }
    100%{ filter:brightness(1) saturate(1); transform:scale(1); }
  }
  .namineTransformFlashLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:55;
    background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(233,164,208,0.25) 60%, transparent 75%);
    opacity:0;
    animation: namineFlashFade .5s ease-out forwards;
  }
  @keyframes namineFlashFade{
    0%{ opacity:0; }
    20%{ opacity:1; }
    100%{ opacity:0; }
  }
  /* ダッフィーのフォーチュン・トラペゾイド：盤面上に逆台形（上辺が広く下辺が狭い）の範囲を光らせる演出 */
  .duffyTrapezoidLayer{
    position:absolute;
    pointer-events:none;
    z-index:55;
    background:linear-gradient(180deg, rgba(255,255,255,0.85), rgba(201,147,90,0.35) 60%, transparent 100%);
    box-shadow:0 0 16px 4px rgba(201,147,90,0.6);
    opacity:0;
    animation: duffyTrapezoidFade .55s ease-out forwards;
  }
  @keyframes duffyTrapezoidFade{
    0%{ opacity:0; transform:scaleY(0.7); }
    25%{ opacity:1; transform:scaleY(1); }
    100%{ opacity:0; transform:scaleY(1); }
  }
  /* ナミネ・ソラは種類が違っても繋げられることを示す特別なリンク色の縁取り */
  .tsum.namineLinkable .face{
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.15), inset 0 5px 8px rgba(255,255,255,0.5), 0 0 0 2px #fff, 0 0 8px 2px rgba(233,164,208,0.85), 0 4px 6px rgba(0,0,0,0.15);
  }
  /* 怒ったフック船長・フック船長本体は種類が違っても繋げられることを示す特別なリンク色の縁取り */
  .tsum.hookLinkable .face{
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.15), inset 0 5px 8px rgba(255,255,255,0.5), 0 0 0 2px #fff, 0 0 10px 3px rgba(192,57,43,0.9), 0 4px 6px rgba(0,0,0,0.15);
  }
  /* サリーの効果時間中：少し離れていても繋がることを示す紫の縁取り */
  .tsum.sallyLinkable .face{
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.15), inset 0 5px 8px rgba(255,255,255,0.5), 0 0 0 2px #fff, 0 0 10px 3px rgba(160,140,196,0.9), 0 4px 6px rgba(0,0,0,0.15);
  }
  /* サリーのスキル：チェーンをたどるアニメーション中に光るツム（薄暗くなる演出より手前に浮き上がらせる） */
  .tsum.sallyTraced{
    z-index:57;
  }
  .tsum.sallyTraced .face{
    animation: sallyTracePulse 0.85s ease-out;
    box-shadow: 0 0 0 3px #fff, 0 0 16px 5px rgba(160,140,196,0.95);
  }
  @keyframes sallyTracePulse{
    0%{ filter:brightness(1); transform:scale(1); }
    45%{ filter:brightness(1.7); transform:scale(1.12); }
    100%{ filter:brightness(1); transform:scale(1); }
  }

  /* ---------- ジャック＆サリー：ドリームスティッチ発動時の縫い糸ライン演出 ---------- */
  /* サリーのスキル発動の瞬間、盤面全体に紫の縫い目のようなラインが走る（アニメ本編の"ステッチ"モチーフ） */
  .sallyStitchLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:54;
    overflow:hidden;
  }
  .sallyStitchLine{
    position:absolute;
    left:-15%;
    width:130%;
    height:3px;
    background:repeating-linear-gradient(90deg, #c9b8dd 0 10px, transparent 10px 20px);
    box-shadow:0 0 8px 2px rgba(155,107,255,0.6);
    opacity:0;
    transform:scaleX(0);
    transform-origin:left center;
  }
  .sallyStitchLine.play{
    animation: sallyStitchDraw 1.0s ease-out forwards;
  }
  @keyframes sallyStitchDraw{
    0%{ opacity:0; transform:scaleX(0); }
    15%{ opacity:1; }
    85%{ opacity:1; transform:scaleX(1); }
    100%{ opacity:0; transform:scaleX(1); }
  }
  /* サリー発動中は盤面全体をほんのり紫に染めて「効果中」を分かりやすくする */
  .sallyAuraLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:8;
    background:radial-gradient(ellipse at 50% 40%, rgba(155,107,255,0.16), transparent 70%);
    opacity:0;
    transition:opacity .4s ease;
  }
  .sallyAuraLayer.show{ opacity:1; }

  /* ---------- ジャック＆サリー：合体（ドリームスクランブル）演出 ---------- */
  /* サブツム消去後、ジャックとサリーが画面中央へ吸い寄せられるように寄っていく残像＋発光 */
  .tsum.jackSallyGathering{
    animation: jackSallyGather 0.5s ease-in forwards;
    z-index:57;
  }
  @keyframes jackSallyGather{
    0%{ filter:brightness(1); }
    100%{ filter:brightness(1.9) saturate(1.3); }
  }
  /* 合体の瞬間、中央で弾ける虹色(ジャックのクリーム色×サリーの紫)フラッシュ */
  .jackSallyComboFlash{
    position:absolute;
    left:50%; top:50%;
    width:40px; height:40px;
    margin:-20px 0 0 -20px;
    border-radius:50%;
    pointer-events:none;
    z-index:62;
    background:radial-gradient(circle, #fff 0%, #fff2cf 20%, #c9b8dd 55%, rgba(155,107,255,0) 78%);
    opacity:0;
  }
  .jackSallyComboFlash.play{
    animation: jackSallyFlashBurst 1.3s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes jackSallyFlashBurst{
    0%{ opacity:0; transform:scale(0.2); }
    20%{ opacity:1; transform:scale(1.4); }
    55%{ opacity:0.9; transform:scale(5.5); }
    100%{ opacity:0; transform:scale(9); }
  }
  /* フラッシュの外周に走る星型スパークルの輪 */
  .jackSallyStarRing{
    position:absolute;
    left:50%; top:50%;
    width:10px; height:10px;
    margin:-5px 0 0 -5px;
    pointer-events:none;
    z-index:63;
    font-size:18px;
    line-height:1;
    color:#fff2cf;
    text-shadow:0 0 6px rgba(155,107,255,0.9), 0 0 3px #fff;
    opacity:0;
    transform:translate(0,0) scale(0.4) rotate(0deg);
  }
  .jackSallyStarRing.play{
    animation: jackSallyStarFly 1.4s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes jackSallyStarFly{
    0%{ opacity:0; transform:translate(0,0) scale(0.3) rotate(0deg); }
    12%{ opacity:1; transform:translate(0,0) scale(1.1) rotate(20deg); }
    100%{ opacity:0; transform:translate(var(--starX,0), var(--starY,0)) scale(0.6) rotate(200deg); }
  }
  /* 「ドリームスクランブル」テキストが強調して現れる専用ラベル演出（虹色グラデ縁取り、少し大きめにスケール） */
  #comboDisplay.jackSallyLabel{
    background:linear-gradient(135deg,#f4f0e6,#c9b8dd 55%,#9b6bff);
    color:#402a5c;
    font-size:16px;
    box-shadow:0 4px 0 rgba(0,0,0,0.15), 0 0 14px 3px rgba(155,107,255,0.6);
  }

  /* ---------- 最終決戦フック船長：斜めに切るアニメーション ---------- */
  .hookSlashLayer{
    position:absolute;
    left:0; top:0;
    width:140%; height:8px;
    background:linear-gradient(90deg, transparent, #fff8dd 15%, #fff 50%, #fff8dd 85%, transparent);
    box-shadow:0 0 14px 4px rgba(255,255,255,0.9);
    transform-origin:left center;
    pointer-events:none;
    z-index:58;
    opacity:0;
  }
  .hookSlashLayer.play{
    animation: hookSlashSweep 0.9s ease-out forwards;
  }
  @keyframes hookSlashSweep{
    0%{ opacity:0; transform:rotate(var(--hookSlashAngle, -68deg)) scaleX(0.2); }
    25%{ opacity:1; }
    70%{ opacity:1; transform:rotate(var(--hookSlashAngle, -68deg)) scaleX(1); }
    100%{ opacity:0; transform:rotate(var(--hookSlashAngle, -68deg)) scaleX(1); }
  }
  /* 怒ったフック船長が消去の瞬間、自分のフックで切る仕草をする軽いモーション */
  .tsum.hookSlashing{
    animation: hookSlashMotion 0.9s ease-out;
    z-index:59;
  }
  @keyframes hookSlashMotion{
    0%{ transform:rotate(0deg) scale(1); }
    35%{ transform:rotate(-18deg) scale(1.05); }
    65%{ transform:rotate(10deg) scale(1.08); }
    100%{ transform:rotate(0deg) scale(1); }
  }
  /* 消去後、怒ったフック船長が大きくなるアニメーション */
  .tsum.hookGrowing{
    animation: hookGrowPulse 0.85s cubic-bezier(.3,1.4,.5,1);
    z-index:59;
  }
  @keyframes hookGrowPulse{
    0%{ filter:brightness(1); }
    40%{ filter:brightness(1.6); }
    100%{ filter:brightness(1); }
  }
  /* スキル効果時間終了：怒ったフック船長が元のフック船長本体へ戻るアニメーション */
  .tsum.hookReverting{
    animation: hookRevertPulse 0.7s cubic-bezier(.3,1.2,.4,1);
    z-index:59;
  }
  @keyframes hookRevertPulse{
    0%{ filter:brightness(1) saturate(1); transform:scale(1) rotate(0deg); }
    40%{ filter:brightness(2.2) saturate(0); transform:scale(1.15) rotate(-8deg); }
    70%{ filter:brightness(1.6) saturate(0.4); transform:scale(0.9) rotate(4deg); }
    100%{ filter:brightness(1) saturate(1); transform:scale(1) rotate(0deg); }
  }
  /* スキル発動：怒ったフック船長が画面中央に出現するアニメーション。
     時間停止で盤面が薄暗くなる中、本人だけスポットライトで浮き上がりつつ
     小さく震えながら一気に膨れ上がって現れる演出。
     --hookPos に配置用のtranslate()文字列を入れてもらい、scale/rotateと合成することで、
     アニメーションのtransformが本来の配置(translate)を消してしまわないようにする。 */
  .tsum.hookAppearing{
    animation: hookAppearPulse 0.9s cubic-bezier(.2,1.3,.3,1);
    z-index:59;
  }
  @keyframes hookAppearPulse{
    0%{ opacity:0; filter:brightness(2.4) saturate(0); transform:var(--hookPos) scale(0.15) rotate(0deg); }
    35%{ opacity:1; filter:brightness(2.4) saturate(0); transform:var(--hookPos) scale(1.25) rotate(-10deg); }
    55%{ filter:brightness(1.8) saturate(0.5); transform:var(--hookPos) scale(0.92) rotate(6deg); }
    75%{ filter:brightness(1.3) saturate(0.85); transform:var(--hookPos) scale(1.06) rotate(-2deg); }
    100%{ opacity:1; filter:brightness(1) saturate(1); transform:var(--hookPos) scale(1) rotate(0deg); }
  }

  /* ---------- 野獣のワイルドクロー演出：右上から左下へ引っ掻く ---------- */

    30%{ opacity:1; }
    65%{ transform: rotate(var(--beastClawAngle, -55deg)) scaleY(1); opacity:1; }
    100%{ transform: rotate(var(--beastClawAngle, -55deg)) scaleY(1); opacity:0; }

  /* ---------- キャプテンライトイヤーのカットイン演出 ---------- */

  .burstText{

  /* 消去数表示：消去した場所の中心から画面中心寄りに表示。
     出現直後は少し小さめから始まり、じわじわ拡大しながらフェードアウトする。
     0.8秒の表示時間ぶんアニメーション時間を合わせてある。 */
  .eraseCountLabel{
    position:absolute;
    left:0; top:0;
    transform:translate(-50%,-50%) scale(0.85);
    font-weight:900;
    font-size:34px;

  @keyframes eraseCountPop{
    0%{ transform:translate(-50%,-50%) scale(0.85); opacity:1; }
    60%{ transform:translate(-50%,-50%) scale(1.25); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1.5); opacity:0; }

  /* 30消去以上：文字を虹色グラデーション＋光るアニメーションにする */

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-stroke:2.5px rgba(0,0,0,0.5);
    animation:eraseCountPop 0.8s ease-out forwards, eraseRainbowShift 0.8s linear forwards;

  const FLOOR_CURVE_DEPTH = 70; // px（中央が最も深くなる量）
  function floorYAt(x){
    if(boardW<=0) return boardH;

  // 比率は絶対に変えない。余った部分は #appOuter の下に見えている body の水色背景がそのまま埋める。
  function layoutAppFrame(){
    const outerW = appOuterEl.clientWidth;
    const outerH = appOuterEl.clientHeight;
    if(outerW<=0 || outerH<=0) return;
    const scale = Math.min(outerW/APP_RATIO_W, outerH/APP_RATIO_H);

    const appH = Math.floor(APP_RATIO_H*scale);
    appEl.style.width = appW+'px';

    appEl.style.maxWidth = 'none';
    appEl.style.maxHeight = 'none';

  function computeBoardSize(){
    // #board は #boardFrame（見た目の枠）と全く同じ inset:6px 10px の絶対配置。
    // 当たり判定を見た目通りにするため、実際にレンダリングされた #boardFrame の
    // サイズをそのまま採用する（padding計算を独自にやり直して二重にズレるのを防ぐ）。
    const frameRect = boardFrame.getBoundingClientRect();
    const w = Math.floor(frameRect.width);
    const h = Math.floor(frameRect.height);
    return {w, h};
  }

  function layoutBoard(){
    layoutAppFrame();
    const {w,h} = computeBoardSize();
    boardW = w; boardH = h;
    board.style.width = boardW+'px';
    board.style.height = boardH+'px';
    ropeSvg.setAttribute('width', boardW);
    ropeSvg.setAttribute('height', boardH);
    ropeSvg.style.width = boardW+'px';
    ropeSvg.style.height = boardH+'px';
    // 盤面の底の弧を描画（視覚的にも「少し湾曲した底」であることが分かるように）
    {
      const fc = document.getElementById('floorCurveSvg');
      if(fc){
        const h = FLOOR_CURVE_DEPTH + 4;
        fc.style.top = (boardH - h)+'px';
        fc.style.bottom = 'auto';
        fc.setAttribute('viewBox', `0 0 ${boardW} ${h}`);
        fc.setAttribute('width', boardW);
        fc.setAttribute('height', h);
        fc.style.height = h+'px';
        const steps = 24;
        let d = `M0,${h}`;
        for(let i=0;i<=steps;i++){
          const x = boardW*i/steps;
          const y = h + (floorYAt(x) - boardH); // 中央=h(下端)、端はfloorYAtが小さいほど上へ
          d += ` L${x.toFixed(1)},${y.toFixed(1)}`;
        }
        d += ` L${boardW},${h} Z`;
        fc.innerHTML = `<path d="${d}" fill="rgba(0,0,0,0.10)"></path>`;
      }

    tsumRadius = Math.max(13, Math.round((Math.floor(boardW/6/2*0.8) - 2) * 0.85 * 1.2 * 1.05 * 1.1 * 1.1));

    tsums.forEach(t=>{

  // ダッフィーをマイツムに設定している間、マイツム自身の出現重みを上げて降ってきやすくする（おまけ効果）。
  const DUFFY_MY_TSUM_WEIGHT = 2.2; // 通常の何倍の確率で選ばれるようにするか
  function randomType(){
    if(gastonRainActive){

      const weights = activeTsumTypes.map(t=> isMineType(t) ? DUFFY_MY_TSUM_WEIGHT : 1);
      const total = weights.reduce((s,w)=>s+w,0);
      let r = Math.random()*total;
      let idx = 0;
      for(let i=0;i<weights.length;i++){
        r -= weights[i];
        if(r<=0){ idx = i; break; }
      }
      picked = activeTsumTypes[idx];

      if(myTsumKey==='stitch' && stitchStage>=2){

  // 配色の法則：同系色グループ（colorGroup）からは1種類までしか選ばない（視認性の確保）
  // colorGroupは種類ごとに細分化されているが、見た目の色味としては同じに見える
  // グループ同士があるため（例：プリンス='blue' とスティッチ='blue2' はどちらも青系）、
  // 同時出現の判定ではこのエイリアスを通して「見た目のグループ」に正規化する。
  const VISUAL_GROUP_ALIAS = {
    blue2: 'blue',        // スティッチ（変身含む）とプリンス／バズは同じ青系として扱う
    skinTone: 'cream',    // フック船長とナミネはどちらも薄いクリーム／肌色系として扱う
  };
  function visualGroup(t){
    return VISUAL_GROUP_ALIAS[t.colorGroup] || t.colorGroup;
  }

  function buildActiveTsumTypes(count){
    const mine = TSUM_TYPES.find(t=>t.key===myTsumKey);
    const usedGroups = new Set([visualGroup(mine)]);
    const picked = [mine];

    // ペアツム（ジャック＆サリーなど）を選んでいる場合は、相方も必ず一緒に盤面へ出す
    if(mine.pairKey){
      const partner = TSUM_TYPES.find(t=>t.key===mine.pairKey);
      if(partner){ picked.push(partner); usedGroups.add(visualGroup(partner)); }
    }

    // 専用の追加サブツム（スティッチの「赤いかご」など）を選んでいる場合は必ず一緒に盤面へ出す
    if(mine.extraSubKey){
      const extra = TSUM_TYPES.find(t=>t.key===mine.extraSubKey);
      if(extra){ picked.push(extra); usedGroups.add(visualGroup(extra)); }
    }

    const rest = TSUM_TYPES.filter(t=>t.key!==myTsumKey && t.key!==mine.pairKey && t.key!==mine.extraSubKey);
    for(let i=rest.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [rest[i], rest[j]] = [rest[j], rest[i]];
    }

    // 第1パス：まだ使われていない「見た目の色グループ」からのみ選ぶ
    for(const t of rest){
      if(picked.length>=count) break;
      const vg = visualGroup(t);
      if(!usedGroups.has(vg)){
        picked.push(t);
        usedGroups.add(vg);
      }
    }
    // 種類数が色グループの数より多く必要な場合のみ、やむを得ず同系色も許容して埋める
    if(picked.length<count){
      for(const t of rest){
        if(picked.length>=count) break;
        if(!picked.includes(t)) picked.push(t);
      }
    }
    return picked;
  }

  function lighten(hex){
    const c = hex.replace('#','');
    const num = parseInt(c,16);
    let r=(num>>16)+60, g=((num>>8)&0xff)+60, b=(num&0xff)+60;
    r=Math.min(255,r); g=Math.min(255,g); b=Math.min(255,b);
    return `rgb(${r},${g},${b})`;
  }

            strand.style.background = 'linear-gradient(180deg,#c1502f,#7a2814)';
            strand.style.borderRadius = '50% 50% 40% 40%';
            strand.style.transform = `translateX(-50%) rotate(${sign*(10+i*9)}deg)`;
            face.appendChild(strand);
          });
        });
        const hairTop = document.createElement('div');
        hairTop.className='motif';
        hairTop.style.width = size*0.5+'px';
        hairTop.style.height = size*0.14+'px';
        hairTop.style.left = '50%'; hairTop.style.top = '0%';
        hairTop.style.transform = 'translateX(-50%)';
        hairTop.style.background = 'linear-gradient(180deg,#c1502f,#7a2814)';
        hairTop.style.borderRadius = '50% 50% 30% 30%';
        face.appendChild(hairTop);
        // 継ぎ接ぎの縫い目（右頬に1本だけ、はっきりと見えるステッチ）
        for(let i=0;i<3;i++){
          const stitch = document.createElement('div');
          stitch.className='motif';
          stitch.style.width = Math.max(2,size*0.025)+'px';
          stitch.style.height = size*0.08+'px';
          stitch.style.left = '76%'; stitch.style.top = (44+i*9)+'%';
          stitch.style.background = '#1c2230';
          stitch.style.transform = 'rotate(70deg)';
          face.appendChild(stitch);
        }
        // にっこり笑った大きな口（サリーらしい柔らかい笑顔）
        const grin = document.createElement('div');
        grin.className='motif';
        grin.style.width = size*0.34+'px';
        grin.style.height = size*0.2+'px';
        grin.style.left = '50%'; grin.style.top = '58%';
        grin.style.transform = 'translateX(-50%)';
        grin.style.background = 'transparent';
        grin.style.border = 'none';
        grin.style.borderBottom = `${Math.max(2,size*0.05)}px solid #1c2230`;
        grin.style.borderRadius = '0 0 50% 50%/0 0 90% 90%';
        face.appendChild(grin);
        break;
      }
      case 'duffyEars': {
        // ダッフィー：くまの丸い耳2つ＋鼻先の薄いパッチ
        [ -1, 1 ].forEach(sign=>{
          const ear = document.createElement('div');
          ear.className='motif';
          const s = size*0.3;
          ear.style.width = s+'px';
          ear.style.height = s+'px';
          ear.style.background = `radial-gradient(circle at 35% 30%, ${lighten(type.color)} 0%, ${type.color} 60%, ${type.dark} 100%)`;
          ear.style.borderRadius = '50%';
          ear.style.left = (50+sign*30)+'%';
          ear.style.top = '-14%';
          ear.style.transform = 'translate(-50%,-50%)';
          ear.style.boxShadow = 'inset 0 -3px 4px rgba(0,0,0,0.15)';
          face.appendChild(ear);
          // 耳の内側（少し明るい色）
          const inner = document.createElement('div');
          inner.className='motif';
          const innerS = s*0.55;
          inner.style.width = innerS+'px';
          inner.style.height = innerS+'px';
          inner.style.background = lighten(type.color);
          inner.style.borderRadius = '50%';
          inner.style.left = (50+sign*30)+'%';
          inner.style.top = '-14%';
          inner.style.transform = 'translate(-50%,-50%)';
          face.appendChild(inner);
        });
        // 鼻先の吻部パッチ（丸みのある薄い色の楕円）
        const muzzle = document.createElement('div');
        muzzle.className='motif';
        muzzle.style.width = size*0.4+'px';
        muzzle.style.height = size*0.3+'px';
        muzzle.style.left = '50%'; muzzle.style.top = '58%';
        muzzle.style.transform = 'translate(-50%,-50%)';
        muzzle.style.background = lighten(type.color);
        muzzle.style.borderRadius = '50%';
        muzzle.style.opacity = '0.85';
        face.appendChild(muzzle);
        break;
      }
    }
  }

  // ------------------------------------------------------------
  // Tsum DOM
  // ------------------------------------------------------------
  function createTsumEl(type, isMine, size){
    const el = document.createElement('div');
    el.className = 'tsum' + (isMine? ' mytsum':'');
    el.style.width = size+'px';
    el.style.height = size+'px';

    const face = document.createElement('div');
    face.className = 'face';
    face.style.background = `radial-gradient(circle at 35% 28%, ${lighten(type.color)} 0%, ${type.color} 55%, ${type.dark} 100%)`;
    el.appendChild(face);

    addMotif(face, type, size);

    const eyeScale = type.eyeScale || 1;
    const eyeSize = size*0.09*eyeScale;
    const eyeL = document.createElement('div');
    eyeL.className='eye';
    eyeL.style.width = eyeSize+'px';
    eyeL.style.height = (eyeSize*1.2)+'px';
    eyeL.style.left = '32%';
    eyeL.style.top = '38%';
    if(type.eyeColor) eyeL.style.background = type.eyeColor;
    const eyeR = eyeL.cloneNode();
    eyeR.style.left = '58%';
    face.appendChild(eyeL);
    face.appendChild(eyeR);

    const cheekSize = size*0.13;
    const cheekL = document.createElement('div');
    cheekL.className='cheek';
    cheekL.style.width = cheekSize+'px';
    cheekL.style.height = (cheekSize*0.6)+'px';
    cheekL.style.left = '18%';
    cheekL.style.top = '55%';
    const cheekR = cheekL.cloneNode();
    cheekR.style.left = '64%';
    face.appendChild(cheekL);
    face.appendChild(cheekR);

    if(type.motif !== 'sallyPatch'){
      const mouth = document.createElement('div');
      mouth.style.position='absolute';
      mouth.style.left='38%';
      mouth.style.top='52%';
      mouth.style.width = (size*0.24)+'px';
      mouth.style.height = (size*0.14)+'px';
      mouth.style.borderBottom = `${Math.max(2,size*0.045)}px solid rgba(58,43,26,0.7)`;
      mouth.style.borderRadius='50%';
      face.appendChild(mouth);
    }

    return el;
  }

  // ------------------------------------------------------------
  // Physics object factory
  // ------------------------------------------------------------
  const BIG_TSUM_CHANCE = 0.015;   // 大ツム（デカツム）出現確率：約1.5%
  const BIG_TSUM_SCALE = 1.7;      // 通常の半径に対する大ツムの倍率
  const BIG_TSUM_COUNT_WEIGHT = 5; // 大ツムはチェーン数・スコア・ゲージ計算上「ツム5個分」として扱う

  function spawnTsum(x, y, vx, vy, forcedType, forceBig){
    const type = forcedType || randomType();
    const isMine = isMineType(type);
    // 大ツムはガストンレイン中・ボム・幽霊は対象外。自然発生は低確率のランダム。
    const isBig = forceBig!==undefined ? forceBig :
      (!gastonRainActive && Math.random() < BIG_TSUM_CHANCE);
    const r = isBig ? Math.round(tsumRadius*BIG_TSUM_SCALE) : tsumRadius;
    const size = r*2;
    const el = createTsumEl(type, isMine, size);
    if(isBig) el.classList.add('bigTsum');
    board.appendChild(el);
    const t = {
      id: idCounter++,
      type, el, isMine, isBomb:false,
      x, y, vx, vy,
      r,
      baseR: tsumRadius,
      isBig,
      rot: (Math.random()-0.5)*60,       // 落下開始時のランダムな初期回転角度（度）
      rotSpeed: (Math.random()-0.5)*260, // 落下中の回転速度（度/秒）
      settled:false,
      enteredBoard: (y - r >= 0), // 画面外上空(y<r)から生成された場合はfalse。降ってきて盤面に入ったらtrueになる
    };
    attachHandlers(t);
    tsums.push(t);
    renderTsumPosition(t);
    return t;
  }

  function renderTsumPosition(t){
    if(t.sucking) return; // ゲージへ吸い込まれる演出中は、演出側で直接transformを制御するため上書きしない
    // 変化がなければDOM書き込みをスキップ（静止したツムを毎フレーム書き換えるのを防ぎ負荷を減らす）
    if(t._lastX===t.x && t._lastY===t.y && t._lastRot===t.rot) return;
    t._lastX = t.x; t._lastY = t.y; t._lastRot = t.rot;
    // 中心座標(x,y)→ CSS left/top(左上基準)に変換してtransformで描画
    // 落下中は回転させ、着地後は徐々に角度を0へ戻して安定させる（お互いにぶつかりながら転がる演出）
    const rotPart = t.rot ? ` rotate(${t.rot}deg)` : '';
    t.el.style.transform = `translate(${t.x - t.r}px, ${t.y - t.r}px)${rotPart}`;
  }

  // ------------------------------------------------------------
  // Input handling（座標ベース：グリッドではなく実際の距離で判定）
  // ------------------------------------------------------------
  function attachHandlers(t){
    t.el.addEventListener('pointerdown', (e)=>{
      if(!gameActive || skillActive || t.ghost || hookAnimFreeze || buzzTapMode) return;
      e.preventDefault();
      // 暗黙のポインターキャプチャを解除し、boardのpointermoveで追跡できるようにする
      if(e.pointerId!=null && t.el.hasPointerCapture && t.el.hasPointerCapture(e.pointerId)){
        t.el.releasePointerCapture(e.pointerId);
      }
      if(t.isBomb){
        detonateBomb(t);
        return;
      }
      startSelection(t);
    });
  }

  function getBoardLocalPoint(e){
    const rect = board.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  // maxDistRatio: そのツム自身の半径(t.r)に対する割合で判定距離を決める。
  // 1.0に近いほど「ツムの見た目のふちギリギリまで」なぞり判定に含まれる。
  function findTsumNear(x, y, maxDistRatio){
    let best = null, bestD = Infinity;
    for(const t of tsums){
      if(t.isBomb || t.ghost) continue;
      const dx = t.x - x, dy = t.y - y;
      const d = Math.sqrt(dx*dx + dy*dy);
      // 大ツムや成長した怒ったフック船長など、ツムごとに実際の大きさ(t.r)が違うため、
      // 固定距離ではなく各ツム自身の半径を基準にした判定距離を使う。
      const maxDist = t.r * maxDistRatio;
      if(d < maxDist && d < bestD){
        bestD = d; best = t;
      }
    }
    return best;
  }

  let lastPointerPoint = null;

  board.addEventListener('pointermove', (e)=>{
    if(!selecting || !gameActive || skillActive || hookAnimFreeze || buzzTapMode) return;
    const p = getBoardLocalPoint(e);
    if(lastPointerPoint){
      // なぞる速度が速くフレームが飛んでも、前回座標→今回座標を線分状に
      // サンプリングして通過したツムを拾う（弾道判定によるフレームスキップ対策）
      // 刻み幅を細かくして、素早いなぞりでも取りこぼしを減らす
      const dx = p.x - lastPointerPoint.x, dy = p.y - lastPointerPoint.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const steps = Math.min(48, Math.max(1, Math.ceil(dist / (tsumRadius*0.3))));
      for(let i=1; i<=steps; i++){
        const sx = lastPointerPoint.x + dx*(i/steps);
        const sy = lastPointerPoint.y + dy*(i/steps);
        // ツムの見た目の縁を少し超えたあたりまでなぞり判定に含め、
        // 指が多少ズレても拾いやすくする（つながる距離＝linkRangeは変更しない）
        const t = findTsumNear(sx, sy, 1.15);
        if(t) tryAddToSelection(t);
      }
    } else {
      const t = findTsumNear(p.x, p.y, 1.15);
      if(t) tryAddToSelection(t);
    }
    lastPointerPoint = p;
  });

  window.addEventListener('pointerup', ()=>{ if(selecting) endSelection(); });
  window.addEventListener('pointercancel', ()=>{ if(selecting) endSelection(); });

  function startSelection(t){
    selecting = true;
    selectedPath = [t];
    selectedType = t.type.key;
    lastPointerPoint = {x:t.x, y:t.y};
    t.selected = true;
    t.vx = 0; t.vy = 0;
    t.el.classList.add('selected');
    if(t.type.key==='namine' || t.type.key==='sora') t.el.classList.add('namineLinkable');
    if(t.type.key==='hook' || t.type.key==='hookAngry') t.el.classList.add('hookLinkable');
    updateRope();
    updateLinkCount();
  }

  // ナミネとソラは互いに「同じ種類」とみなして自由に（離れていても）つなげられる特殊ペア
  function isNamineSoraPair(keyA, keyB){
    return (keyA==='namine' && keyB==='sora') || (keyA==='sora' && keyB==='namine');
  }
  // 怒ったフック船長とフック船長本体も、離れていても自由につなげられる特殊ペア
  function isHookPair(keyA, keyB){
    return (keyA==='hook' && keyB==='hookAngry') || (keyA==='hookAngry' && keyB==='hook');
  }
  function sameChainType(keyA, keyB){
    return keyA===keyB || isNamineSoraPair(keyA, keyB) || isHookPair(keyA, keyB);
  }

  function tryAddToSelection(t){
    if(!sameChainType(t.type.key, selectedType)) return;
    const len = selectedPath.length;
    if(len>=2 && selectedPath[len-2] === t){
      const removed = selectedPath.pop();
      removed.selected = false;
      removed.el.classList.remove('selected','namineLinkable','hookLinkable','sallyLinkable');
      updateRope(); updateLinkCount();
      return;
    }
    if(selectedPath.includes(t)) return;
    const last = selectedPath[selectedPath.length-1];
    // ナミネ⇄ソラ、怒ったフック船長⇄フック船長本体 は、盤面上どれだけ離れていてもつながる
    if(isNamineSoraPair(t.type.key, last.type.key) || isHookPair(t.type.key, last.type.key)){
      selectedPath.push(t);
      t.selected = true;
      t.vx = 0; t.vy = 0;
      t.el.classList.add('selected', isHookPair(t.type.key, last.type.key) ? 'hookLinkable' : 'namineLinkable');
      updateRope(); updateLinkCount();
      return;
    }
    const dx = t.x - last.x, dy = t.y - last.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    // 隣接判定：実座標での距離がツム直径の約1.7倍以内なら「つながる」とみなす
    // サリーのスキル効果中は、この許容距離が広がり少し離れたツムともつながる
    const linkRange = t.r*3.4*(sallyActive ? SALLY_LINK_RANGE_MULT/3.4 : 1);
    if(dist <= linkRange){
      selectedPath.push(t);
      t.selected = true;
      t.vx = 0; t.vy = 0;
      t.el.classList.add('selected');
      if(t.type.key==='namine' || t.type.key==='sora') t.el.classList.add('namineLinkable');
      if(t.type.key==='hook' || t.type.key==='hookAngry') t.el.classList.add('hookLinkable');
      if(sallyActive) t.el.classList.add('sallyLinkable');
      updateRope(); updateLinkCount();
    }
  }

  function updateLinkCount(){
    linkCountEl.textContent = selectedPath.length;
    if(selectedPath.length>0){
      const last = selectedPath[selectedPath.length-1];
      chainCountBadge.textContent = selectedPath.length;
      chainCountBadge.style.left = last.x+'px';
      chainCountBadge.style.top = (last.y-last.r-4)+'px';
      chainCountBadge.classList.add('show');
    } else {
      chainCountBadge.classList.remove('show');
    }
  }

  function updateRope(){
    ropeSvg.innerHTML = '';
    if(selectedPath.length<1) return;
    let d = '';
    selectedPath.forEach((t,i)=>{
      d += (i===0? 'M':'L') + t.x + ' ' + t.y + ' ';
    });
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d.trim());
    path.setAttribute('stroke', inFever? '#ffcc33' : '#ff4fa0');
    path.setAttribute('stroke-width', Math.max(4,tsumRadius*0.24));
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('stroke-linejoin','round');
    path.setAttribute('fill','none');
    path.setAttribute('opacity','0.85');
    ropeSvg.appendChild(path);

    selectedPath.forEach((t)=>{
      const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx',t.x); dot.setAttribute('cy',t.y);
      dot.setAttribute('r', Math.max(3,tsumRadius*0.12));
      dot.setAttribute('fill','#fff');
      dot.setAttribute('opacity','0.9');
      ropeSvg.appendChild(dot);
    });
  }

  function endSelection(){
    selecting = false;
    lastPointerPoint = null;
    const path = selectedPath;
    selectedPath = [];
    selectedType = null;
    ropeSvg.innerHTML = '';
    linkCountEl.textContent = '0';
    chainCountBadge.classList.remove('show');
    path.forEach(t=>{ t.selected = false; });

    // 最終決戦フック船長スキル中：怒ったフック船長とフック船長本体のペアを含み、
    // 怒ったフック船長自身を含めて3つ以上つないだ場合にのみ、斜めライン消去が発動する専用フローへ進む。
    // hookActive を見ているのは、スキル効果時間が終わっている（＝怒ったフック船長が元に戻るべき）のに
    // 斜め消去だけがいつまでも発動し続けてしまう不具合を防ぐため。
    const hasHookPair = hookActive && path.some(t=> t.type.key==='hookAngry') && path.some(t=> t.type.key==='hook');
    if(hasHookPair && path.length>=3){
      resolveHookChain(path);
      return;
    }

    if(path.length >= 3){
      resolveMatch(path);
    } else {
      path.forEach(t=>t.el.classList.remove('selected','namineLinkable','hookLinkable'));
    }
  }

  // ------------------------------------------------------------
  // Combo timing
  // ------------------------------------------------------------
  function bumpCombo(){
    comboCount++;
    if(comboTimer) clearTimeout(comboTimer);
    if(!inFever){
      comboTimer = setTimeout(()=>{ comboCount = 0; }, COMBO_TIMEOUT_MS);
    }
  }

  // ------------------------------------------------------------
  // Score / coin computation
  // ------------------------------------------------------------
  function computeScore(path, effectiveN){
    const n = effectiveN!==undefined ? effectiveN : path.length;
    const baseChainScore = 40 * Math.pow(n, 1.55);
    const tsumScoreSum = path.reduce((sum,t)=> sum + t.type.score * (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    const comboBonus = Math.min(comboCount * 0.01, 3.0);
    const feverMult = inFever ? 2.0 : 0;
    const total = (baseChainScore + tsumScoreSum) * (1 + comboBonus) * (1 + feverMult) * scoreMultiplier;
    return Math.round(total);
  }

  // ------------------------------------------------------------
  // Match resolution
  // ------------------------------------------------------------
  function removeTsum(t){
    const idx = tsums.indexOf(t);
    if(idx>=0) tsums.splice(idx,1);
  }

  // 消去対象を時間差（ウェーブ）で消していく。消えるまでの間は「幽霊状態」として
  // 物理的な当たり判定だけ残し、上のツムがすり抜けて落ちてこないようにする。
  // centerPoint を渡すとそこから外側へ同心円状に、渡さなければ配列の並び順（起点→終点）で消える。
  // skipGhost=true の場合、対象ツムを ghost（その場に留まる残像＝重力停止＆他ツムへの壁）にはせず、
  // 代わりに noCollide フラグだけを立てる。noCollide のツムは重力・移動の物理演算は通常どおり
  // 受け続けるが、他のツムとの衝突判定（押し出し・支え）からは完全に除外される。
  // つまり見た目のポップ演出中も自分自身は落下・移動し続け（範囲ギリギリで入ってくる／出ていくツムが
  // 自然に動き続けて見える）、かつ他のツムに対して「壁」として干渉することもない。
  // （キャプテンライトイヤーのタップ消去のように、範囲内が即座に判定・消去される演出に使う）
  // suckTargets: Map<tsum, {x,y}>（盤面座標＝boardRect基準）を渡すと、そのツムだけ
  // 通常のpopOutではなく「suckPopping」演出（指定座標へ吸い込まれながら縮小して消える）になる。
  // explicitDelays: Map<tsum, delayMs> を渡すと、そのツムは通常の順序×間隔計算を使わず、
  // 指定されたミリ秒だけ待ってから消える（ナミネ・ソラに巻き込まれたツムを、巻き込んだ
  // ナミネ/ソラ本体と同じタイミングで消すために使う）。
  function popWithWave(list, centerPoint, popClass, onAllDone, instant, onBombReady, skipGhost, suckTargets, gaugeRate, gaugeIgnoreGastonRain, explicitDelays){
    if(list.length===0){ onAllDone && onAllDone(); return; }
    const ordered = list.slice();
    if(centerPoint && !instant){
      ordered.sort((a,b)=>{
        const da = (a.x-centerPoint.x)**2 + (a.y-centerPoint.y)**2;
        const db = (b.x-centerPoint.x)**2 + (b.y-centerPoint.y)**2;
        return da-db;
      });
    }
    const feverSpeed = inFever ? FEVER_POP_SPEED_MULT : 1;
    const POP_DURATION = 420 / feverSpeed;
    // 1個ずつ消えていく間隔を通常より44%遅くする（連続消去の波が伝わる速度）
    const totalWave = instant ? 0 : Math.min(2200, 160*(ordered.length-1)) / feverSpeed * 1.2 * 1.2;
    const stagger = (!instant && ordered.length>1) ? totalWave/(ordered.length-1) : 0;

    // このウェーブ全体で共有する状態。ボムキャン（forceFinishAllGhosts）で個々のタイマーを
    // 途中キャンセルしても、このgroupを介してonBombReady/onAllDoneを確実に一度だけ発火させる。
    const group = {
      remaining: ordered.length,
      bombFired: false,
      allDoneFired: false,
      onBombReady,
      onAllDone,
    };

    let maxFinish = 0;
    ordered.forEach((t, i)=>{
      const explicitDelay = explicitDelays && explicitDelays.get(t);
      const delay = explicitDelay!=null ? explicitDelay : Math.round(i*stagger);
      setTimeout(()=>{
        if(!tsums.includes(t)) return; // 既にボム等で強制終了済み
        t.el.classList.remove('selected','namineLinkable','hookLinkable','sallyLinkable');
        t.el.style.animationDuration = (POP_DURATION/1000)+'s';
        const suckTo = suckTargets && suckTargets.get(t);
        if(suckTo){
          // その場（現在のtranslate位置）を起点に、ゲージ中心へ向かって縮小しながら移動する。
          // renderTsumPositionによる上書きを止めるため t.sucking を立ててから、
          // 現在位置を明示的にセットし直し、次フレームで目標位置へtransitionさせる。
          t.sucking = true;
          t.el.classList.add('suckPopping');
          t.el.style.transition = 'none';
          t.el.style.transform = `translate(${t.x - t.r}px, ${t.y - t.r}px) scale(1)`;
          // 強制リフローしてから目標へ変化させることで、transitionが確実に発火するようにする
          void t.el.offsetWidth;
          t.el.style.transition = `transform ${(POP_DURATION/1000)}s cubic-bezier(.4,0,.7,1), opacity ${(POP_DURATION/1000)}s ease`;
          requestAnimationFrame(()=>{
            t.el.style.transform = `translate(${suckTo.x - t.r}px, ${suckTo.y - t.r}px) scale(0.05)`;
            t.el.style.opacity = '0';
          });
        } else {
          t.el.classList.add(popClass || 'popping');
        }
        if(skipGhost){
          // 物理演算（重力・移動）は継続させたいので t.ghost は立てず、衝突判定だけを無効化する。
          t.noCollide = true;
          t.el.style.pointerEvents = 'none';
        } else {
          t.ghost = true; t.vx = 0; t.vy = 0;
        }
      }, delay);

      const finish = delay + POP_DURATION;
      if(finish>maxFinish) maxFinish = finish;
      const timeoutId = setTimeout(()=>{
        if(tsums.includes(t)) removeTsum(t);
        t.el.remove();
        ghostTimers = ghostTimers.filter(g=>g.t!==t);
        // このツムが実際にゲージへ到着した瞬間に、そのツム1個分だけゲージへ加算する
        applyGaugeForOneTsum(t, suckTargets, gaugeRate, gaugeIgnoreGastonRain);
        finishOne(group, t);
      }, finish);
      ghostTimers.push({t, timeoutId, group, suckTargets, gaugeRate, gaugeIgnoreGastonRain});
    });

    group.total = ordered.length;
  }

  // ウェーブ内の1個のツムが消え終わったときに呼ぶ。通常経路でもボムキャンによる強制終了でも
  // 必ずここを通すことで、全部消え終わった瞬間にonBombReady→(次フレームで)onAllDoneを発火させる。
  function finishOne(group, t){
    group.remaining--;
    if(!group.bombFired && group.remaining<=0){
      group.bombFired = true;
      group.onBombReady && group.onBombReady();
    }
    if(group.remaining<=0 && !group.allDoneFired){
      group.allDoneFired = true;
      // 補充などの後処理は同フレームの他処理と衝突しないよう1フレーム遅らせる
      setTimeout(()=>{ group.onAllDone && group.onAllDone(); }, 16);
    }
  }

  // ボムの爆発などで、まだ消去演出中（幽霊状態）のツムを強制的に即座に消し切る（ボムキャンセル）。
  // 強制終了させたツムそれぞれについても、本来のタイマーが実行するはずだった完了処理
  // （ボム生成判定・補充など）を必ず一度だけ実行してあげる。
  function forceFinishAllGhosts(){
    if(ghostTimers.length===0) return;
    const finishing = ghostTimers;
    ghostTimers = [];
    finishing.forEach(g=>{
      clearTimeout(g.timeoutId);
      if(tsums.includes(g.t)){
        removeTsum(g.t);
        g.t.el.remove();
      }
      // ボムキャンで早送りされた場合も、そのツムのゲージ加算だけは取りこぼさないようにする
      applyGaugeForOneTsum(g.t, g.suckTargets, g.gaugeRate, g.gaugeIgnoreGastonRain);
      finishOne(g.group, g.t);
    });
  }

  // 1個のツムがゲージへ吸い込まれて「到着」した瞬間に、そのツム1個分だけゲージへ加算する。
  // suckTargets で「フィーバーゲージへ向かうツムなのか／スキルゲージへ向かうツムなのか」が
  // 事前に決まっているため、ここではそれに応じて対応するゲージへ1個分だけ反映する。
  // rate: スキルゲージ側への反映率（省略時は1＝100%。バズのタップ消去など一部スキルでのみ0.25等を使う）
  // ignoreGastonRain: true の場合、ガストン降臨タイム中でもスキルゲージ加算をブロックしない。
  //   なぞり始めた（＝チェーンを確定させた）時点ではまだ降臨タイムに入っていなかったのに、
  //   消去演出中に降臨タイムへ突入してしまい、後から消えるツムだけゲージに反映されなくなる…
  //   という取りこぼしを防ぐため、popWithWave呼び出し側で「開始時点の降臨タイム状態」を
  //   固定して渡してもらう。
  function applyGaugeForOneTsum(t, suckTargets, rate, ignoreGastonRain){
    const suckTo = suckTargets && suckTargets.get(t);
    if(!suckTo) return; // 吸い込み対象外（＝ゲージ演出を伴わない消し方）のツムは何もしない
    const weight = t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1;
    if(t.isMine){
      // マイツムは、スキルゲージ（満タンでなければ）に加えて、常にフィーバーゲージにも同時に加算する
      if(!isMySkillGaugeFull()){
        addSkillGauge(weight, [t], rate, ignoreGastonRain);
      }
      if(!inFever){
        feverGauge = Math.min(FEVER_GAUGE_MAX, feverGauge + weight*FEVER_GAUGE_PER_TSUM);
        updateFeverGaugeUI();
      }
    } else if(!inFever){
      feverGauge = Math.min(FEVER_GAUGE_MAX, feverGauge + weight*FEVER_GAUGE_PER_TSUM);
      updateFeverGaugeUI();
    }
  }

  // スキルゲージが（ペアツムの場合は両方とも）満タンかどうか＝これ以上マイツムを消してもゲージへは
  // 溜まらず、あふれた分がフィーバーゲージ側の演出対象になる状態かどうかを判定する。
  function isMySkillGaugeFull(){
    if(isPairMode()) return jackReady && sallyReady;
    return skillReady;
  }

  function resolveMatch(path){
    if(!gameActive) return;

    // サリーのスキル効果中は、サブツムを含む通常のチェーンでも「たどって周りを巻き込む」処理へ
    if(sallyActive){
      bumpCombo();
      resolveSallyChain(path);
      return;
    }

    const n = path.length;
    // 大ツムは「ツム5つ分」として扱う（スコア・コイン・チェーン記録・ゲージ計算の実質個数）
    const effectiveN = path.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    bumpCombo();

    // ナミネのスキル効果中（ソラが存在する間）に、ナミネ・ソラを含むチェーンを消した場合のみ
    // 周囲のツムも巻き込んで一緒に消す。スキル効果外では通常のチェーンとして扱う。
    const hasNamineOrSora = namineActive && path.some(t=> t.type.key==='namine' || t.type.key==='sora');
    let extraTargets = [];
    let extraOwnerMap = new Map(); // 巻き込まれたツム → 巻き込んだナミネ/ソラ本体（pathの中のツム）
    if(hasNamineOrSora){
      const pathIds = new Set(path.map(t=>t.id));
      const radius = tsumRadius * NAMINE_SKILL_RANGE;
      const centers = path.filter(t=> t.type.key==='namine' || t.type.key==='sora');
      const nearbySet = new Set();
      tsums.forEach(t=>{
        if(pathIds.has(t.id) || t.isBomb || t.ghost) return;
        for(const c of centers){
          const dx = t.x-c.x, dy = t.y-c.y;
          if(dx*dx+dy*dy <= radius*radius){
            nearbySet.add(t);
            extraOwnerMap.set(t, c);
            break;
          }
        }
      });
      extraTargets = Array.from(nearbySet);
    }
    const extraEffectiveN = extraTargets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    const totalEffectiveN = effectiveN + extraEffectiveN;

    const bonus = computeScore(path, totalEffectiveN) + (extraTargets.length>0 ? computeScore(extraTargets, extraEffectiveN) : 0);
    score += bonus;
    scoreVal.textContent = score.toLocaleString();

    // ナミネ・ソラを含むチェーンはコイン補正-2（本家のナミネ固有コイン補正）
    const coinBonus = hasNamineOrSora ? -2 : undefined;
    const gainedCoins = coinsForChain(totalEffectiveN, coinBonus);
    coins += gainedCoins;
    coinVal.textContent = coins.toLocaleString();

    if(totalEffectiveN > maxChain) maxChain = totalEffectiveN;
    chainVal.textContent = maxChain;

    const myCount = path.reduce((sum,t)=> sum + (t.isMine ? (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1) : 0), 0)
      + extraTargets.reduce((sum,t)=> sum + (t.isMine ? (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1) : 0), 0);

    showCombo(n, bonus, path, gainedCoins, totalEffectiveN);
    const eraseCountPos = showEraseCount(path.concat(extraTargets), totalEffectiveN, path[path.length-1]);
    burstSparkles(path.concat(extraTargets));
    const suckTargets = buildSuckTargets(path.concat(extraTargets));
    if(gainedCoins>0) burstCoins(path.concat(extraTargets), gainedCoins);

    const spawnBomb = totalEffectiveN >= bombChainThreshold;
    const bombSpot = spawnBomb ? eraseCountPos : null;

    // ゲージへの加算は、各ツムがゲージへ吸い込まれて到着した瞬間ごとに1個分ずつ popWithWave 内で行う。
    // ここでは「なぞり終えた（＝チェーン確定）時点」でガストン降臨タイム中だったかどうかを固定しておく。
    // 効果時間外で繋いだのに、消去演出中に降臨タイムへ突入してしまいゲージ加算が取りこぼされる…
    // という事態を防ぐため、確定時点で降臨タイム外だった場合は、以降のゲージ加算では
    // 降臨タイムによる制限を無視する（＝そのツムたちは通常どおりスキルへ反映する）。
    const gaugeIgnoreGastonRain = !gastonRainActive;

    // path側（なぞった本体）のウェーブ間隔と同じ計算式で、各ナミネ/ソラが何ミリ秒後に消えるかを求める。
    // 巻き込まれたツムは、自分を巻き込んだナミネ/ソラ本体と全く同じタイミングで消えるようにする。
    const pathFeverSpeed = inFever ? FEVER_POP_SPEED_MULT : 1;
    const pathTotalWave = path.length>1 ? Math.min(2200, 160*(path.length-1)) / pathFeverSpeed * 1.2 * 1.2 : 0;
    const pathStagger = path.length>1 ? pathTotalWave/(path.length-1) : 0;
    const namineDelayByTsum = new Map();
    path.forEach((t, i)=>{ namineDelayByTsum.set(t, Math.round(i*pathStagger)); });

    // 巻き込み分は、巻き込んだナミネ/ソラ本体（extraOwnerMap）と同時に消える。
    if(extraTargets.length>0){
      const explicitDelays = new Map();
      extraTargets.forEach(t=>{
        const owner = extraOwnerMap.get(t);
        const ownerDelay = owner ? namineDelayByTsum.get(owner) : undefined;
        explicitDelays.set(t, ownerDelay!=null ? ownerDelay : 0);
      });
      popWithWave(extraTargets, null, 'popping', ()=>{}, false, undefined, false, suckTargets, undefined, gaugeIgnoreGastonRain, explicitDelays);
    }

    // 起点→終点の順にウェーブ状で消えていく（なぞった順番のまま）。
    // 消えるまでの間は幽霊状態として物理的に居座り、上のツムの落下をせき止める。
    popWithWave(path, null, 'popping', ()=>{
      refillIfNeeded(path.concat(extraTargets).map(t=>t.x));
      checkFeverTrigger();
    }, false, ()=>{ if(bombSpot) spawnBombAt(bombSpot); }, false, suckTargets, undefined, gaugeIgnoreGastonRain);
  }

  // マイツム／サブツムが消えるとき、ツム本体が直接吸い込まれていく先の座標（盤面座標系）を
  // ツムごとにMapで組み立てる：
  //  ・マイツム　　　：スキルゲージが満タンでなければ→スキルゲージへ、満タンなら→フィーバーゲージへ
  //  ・サブツム　　　：常にフィーバーゲージへ
  function buildSuckTargets(list){
    const map = new Map();
    if(list.length===0) return map;
    const boardRect = board.getBoundingClientRect();
    const skillRect = skillRingWrap.getBoundingClientRect();
    const feverRect = feverGaugeWrap.getBoundingClientRect();
    const skillPt = { x: skillRect.left + skillRect.width/2 - boardRect.left, y: skillRect.top + skillRect.height/2 - boardRect.top };
    const feverPt = { x: feverRect.left + feverRect.width/2 - boardRect.left, y: feverRect.top + feverRect.height/2 - boardRect.top };
    const gaugeFull = isMySkillGaugeFull();
    list.forEach(t=>{
      if(t.isMine){
        map.set(t, gaugeFull ? feverPt : skillPt);
      } else {
        map.set(t, feverPt);
      }
    });
    return map;
  }

  // ツムの物理半径とDOM要素の実サイズを変更する（位置は中心を保ったまま）。
  // 最終決戦フック船長の「消すたびに大きくなる」演出のために使う。
  function resizeTsum(t, newR){
    t.r = newR;
    const size = newR*2;
    t.el.style.width = size+'px';
    t.el.style.height = size+'px';
    // width/heightに連動する子要素（.face等）はCSSのwidth:100%/height:100%で追従する想定。
    // 位置の再計算は次のrenderTsumPositionで行われるよう、キャッシュを無効化しておく
    t._lastX = undefined; t._lastY = undefined;
    renderTsumPosition(t);
  }

  // 1) 怒ったフック船長が自分のフックで斜めに切るアニメーションを再生し、終わったらコールバック
  function playHookSlashAnim(hookAngry, onDone){
    hookAngry.el.classList.add('hookSlashing');
    const slash = document.createElement('div');
    slash.className = 'hookSlashLayer play';
    slash.style.left = (hookAngry.x - hookAngry.r*1.2)+'px';
    slash.style.top = (hookAngry.y)+'px';
    // 斜めラインの角度(HOOK_LINE_ANGLE_DEG=鉛直基準)を、水平基準のCSS rotate角に変換して反映する
    slash.style.setProperty('--hookSlashAngle', `${90-HOOK_LINE_ANGLE_DEG}deg`);
    board.appendChild(slash);
    setTimeout(()=>{
      hookAngry.el.classList.remove('hookSlashing');
      slash.remove();
      onDone && onDone();
    }, HOOK_CUT_ANIM_MS);
  }

  // 3) 消去後、怒ったフック船長が大きくなるアニメーションを再生し、終わったらコールバック
  function playHookGrowAnim(hookAngry, onDone){
    if(!tsums.includes(hookAngry)){ onDone && onDone(); return; }
    hookAngry.el.classList.add('hookGrowing');
    // 1段階ごとに一回り大きくする（上限を設けて画面からはみ出しすぎないようにする）
    const nextR = Math.min(Math.round(hookAngry.r*1.28), tsumRadius*BIG_TSUM_SCALE*2.4);
    resizeTsum(hookAngry, nextR);
    setTimeout(()=>{
      hookAngry.el.classList.remove('hookGrowing');
      onDone && onDone();
    }, HOOK_GROW_ANIM_MS);
  }

  // 最終決戦フック船長：怒ったフック船長とフック船長本体を繋いだ瞬間の専用消去処理。
  // 通常のなぞり消去とは異なり、
  //  1) 繋いだ瞬間に時間を止める
  //  2) 怒ったフック船長が自分のフックで斜めに切るアニメーション
  //  3) その後、斜めラインが消去される
  //  4) 怒ったフック船長が大きくなるアニメーション
  //  5) 大きくなるアニメーションが終わったら時間停止解除
  // という流れで進む。
  function resolveHookChain(path){
    if(!gameActive) return;

    // スキル効果時間が既に終わっている（＝怒ったフック船長が元に戻るべきタイミングを過ぎている）場合は、
    // 斜め消去を発動させず、通常のなぞり消去としての後始末だけ行って抜ける。
    // これがないと、繋ぐたびに hookAnimFreeze でスキル残り時間の減少が止まる仕組みと相まって、
    // プレイヤーが繋ぎ続ける限り怒ったフック船長がいつまでも元に戻らず、斜め消去が無限に発動し続けてしまう。
    if(!hookActive){
      path.forEach(t=>t.el.classList.remove('selected','namineLinkable','hookLinkable'));
      return;
    }

    bumpCombo();

    const hookAngry = path.find(t=> t.type.key==='hookAngry');
    if(!hookAngry){
      // 万が一見つからない場合は通常のなぞり消去として処理する（フォールバック）
      path.forEach(t=>t.el.classList.remove('selected','namineLinkable','hookLinkable'));
      return;
    }

    // 演出中は入力とスキル効果時間の経過だけを止め、ツムの物理演算（重力・衝突）は止めない。
    // 再開は自動タイマーに任せず、成長アニメーション完了時に明示的に resumeTimerNow() で行う。
    hookAnimFreeze = true;
    hookAnimGhostRef = hookAngry; // 演出中は他のツムと一切干渉させないための参照
    appEl.classList.add('hookAnimDimmed'); // 怒ったフック船長以外を薄暗くする
    hookAngry.el.classList.add('hookSpotlight'); // 怒ったフック船長自身は暗くならないようにする
    clearInterval(timerHandle);
    clearTimeout(timerResumeTimeout);

    // 0) 怒ったフック船長を画面（盤面）中央へ戻す。
    // ここでghost化することで、元いた場所には以後の物理演算・当たり判定が
    // 一切残らないようにし（他ツムがすり抜けられる/ぶつからない）、
    // 成長アニメーションが終わるまでは中央に固定したままにする。
    // 斜めラインの見た目が少し左寄りに感じられたため、戻す位置を少し右へオフセットしている。
    hookAngry.vx = 0; hookAngry.vy = 0;
    hookAngry.ghost = true;
    hookAngry.x = boardW/2 + tsumRadius*HOOK_LINE_X_OFFSET_RATIO;
    hookAngry.y = boardH/2;
    renderTsumPosition(hookAngry);

    // 中央へ戻るアニメーション（.tsumのtransform transitionによる短い移動）が
    // 終わるのを待ってから、1) 斜めに切るアニメーションを開始する
    setTimeout(()=>{
    playHookSlashAnim(hookAngry, ()=>{

      // 2) 斜めラインの巻き込み判定・消去処理
      // 縦寄りの斜め（鉛直から少し傾いた角度）のライン上を巻き込む。
      // 直線の方向ベクトル(dirX,dirY)：鉛直方向(0,1)を基準に HOOK_LINE_ANGLE_DEG 度だけ傾ける。
      const pathIds = new Set(path.map(t=>t.id));
      const angleRad = -HOOK_LINE_ANGLE_DEG * Math.PI/180; // 斜めラインを逆側（左右反転）にする
      const dirX = Math.sin(angleRad), dirY = Math.cos(angleRad); // ライン方向（縦寄り）
      // 怒ったフック船長は「大きくなるたびに同じ比率で消去範囲も拡大する」ため、
      // 現在の半径(hookAngry.r)と初期半径(HOOK_ANGRY_INITIAL_R)の比率をそのまま帯の太さに反映する。
      const growRatio = hookAngry.r / HOOK_ANGRY_INITIAL_R;
      const bandHalf = HOOK_BAND_BASE * growRatio;
      const nearbySet = new Set();
      tsums.forEach(t=>{
        if(pathIds.has(t.id) || t.isBomb || t.ghost) return;
        const dx = t.x-hookAngry.x, dy = t.y-hookAngry.y;
        // ライン方向ベクトルに対する法線方向（垂直方向）への距離を、外積の絶対値で求める
        const distFromLine = Math.abs(dx*dirY - dy*dirX);
        if(distFromLine <= bandHalf) nearbySet.add(t);
      });
      // 怒ったフック船長自身は「大きくなる」演出のため、この時点ではまだ消さずに残す
      const otherPathTsums = path.filter(t=> t!==hookAngry);
      const extraTargets = Array.from(nearbySet);
      const allErased = otherPathTsums.concat(extraTargets);

      const effectiveN = allErased.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0) + BIG_TSUM_COUNT_WEIGHT; // 怒ったフック船長自身も大ツム相当としてカウント
      const bonus = computeScore(allErased, effectiveN);
      score += bonus;
      scoreVal.textContent = score.toLocaleString();

      const gainedCoins = coinsForChain(effectiveN, -2); // 本家同様コイン補正-2
      coins += gainedCoins;
      coinVal.textContent = coins.toLocaleString();

      if(effectiveN > maxChain) maxChain = effectiveN;
      chainVal.textContent = maxChain;

      const myCount = allErased.reduce((sum,t)=> sum + (t.isMine ? (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1) : 0), 0) + BIG_TSUM_COUNT_WEIGHT;

      showCombo(allErased.length, bonus, allErased, gainedCoins, effectiveN);
      showEraseCount(allErased, effectiveN, hookAngry);
      burstSparkles(allErased);
      const suckTargets = buildSuckTargets(allErased);
      if(gainedCoins>0) burstCoins(allErased, gainedCoins);

      hookAngry.el.classList.remove('selected','hookLinkable');
      popWithWave(allErased, null, 'popping', ()=>{
        refillIfNeeded(allErased.map(t=>t.x));

        // 斜めライン消去（ポップ演出）が終わったタイミングで、
        // 画面の薄暗い演出（#board::after）が完全に消えるまでツムの物理演算そのものを止める。
        hookPhysicsPause = true;

        // 3) 怒ったフック船長が大きくなるアニメーション
        // ※次回の消去範囲は hookAngry.r（現在の半径）と HOOK_ANGRY_INITIAL_R の比率から
        //   自動的に決まるため、レベルのようなカウンタを別途持つ必要はない。
        playHookGrowAnim(hookAngry, ()=>{
          hookAnimFreeze = false; // 4) 大きくなるアニメーションが終わったら時間停止解除
          appEl.classList.remove('hookAnimDimmed');
          hookAngry.el.classList.remove('hookSpotlight');
          resumeTimerNow();
          checkFeverTrigger();

          // 画面の薄暗いのが完全に消えきる（#board::afterのopacity transition完了）まで待ってから、
          // 怒ったフック船長を画面中央に置いたまま通常の物理演算（重力・衝突）へ復帰させる。
          setTimeout(()=>{
            hookAngry.ghost = false;
            hookAnimGhostRef = null;
            hookPhysicsPause = false;
          }, HOOK_DIM_FADE_MS);
        });
      }, true, undefined, false, suckTargets);
    });
    }, HOOK_RETURN_TO_CENTER_MS);
  }

  function checkFeverTrigger(){
    if(inFever) return;
    if(feverGauge >= FEVER_GAUGE_MAX){
      enterFever();
    }
  }

  // ------------------------------------------------------------
  // Fever state machine
  // ------------------------------------------------------------
  // フィーバー突入時、盤面(#board)の外枠に沿ってゲーミングイルミネーション用の
  // 電球を等間隔配置する。boardWrap基準の座標系で、boardの矩形の縁をぐるっと一周させる。
  const FEVER_BULB_COLORS = ['#ff4fa0','#ffd23f','#4fd6c4','#4f9dff','#ff9640','#9b6bff','#ff2d55'];
  function buildFeverLights(){
    feverLights.innerHTML = '';
    if(boardW<=0 || boardH<=0) return;

    const offsetX = board.offsetLeft;
    const offsetY = board.offsetTop;
    const spacing = 26; // 電球同士の間隔（px）
    const perimeter = 2*(boardW+boardH);
    const count = Math.max(8, Math.round(perimeter/spacing));

    for(let i=0;i<count;i++){
      const d = (i/count) * perimeter;
      let x, y;
      if(d < boardW){ x = d; y = 0; }
      else if(d < boardW+boardH){ x = boardW; y = d-boardW; }
      else if(d < boardW*2+boardH){ x = boardW-(d-(boardW+boardH)); y = boardH; }
      else { x = 0; y = boardH-(d-(boardW*2+boardH)); }

      const bulb = document.createElement('div');
      bulb.className = 'bulb';
      bulb.style.left = (offsetX+x)+'px';
      bulb.style.top = (offsetY+y)+'px';
      const color = FEVER_BULB_COLORS[i % FEVER_BULB_COLORS.length];
      bulb.style.color = color;
      bulb.style.animationDelay = (Math.random()*1)+'s';
      bulb.style.animationDuration = (0.7+Math.random()*0.6)+'s';
      feverLights.appendChild(bulb);
    }
  }

  function enterFever(){
    inFever = true;
    feverGauge = 0;
    updateFeverGaugeUI();
    feverCount++;
    appEl.classList.add('fever');
    feverBanner.classList.remove('show');
    void feverBanner.offsetWidth;
    feverBanner.classList.add('show');

    buildFeverLights();
    feverLights.classList.add('show');

    pauseTimer(700);

    timeLeft += FEVER_TIME_BONUS;
    timeVal.textContent = timeLeft;

    if(comboTimer) clearTimeout(comboTimer);

    clearTimeout(feverEndTimer);
    feverRemainingMs = FEVER_DURATION*1000; // 以後 frameLoop 内で、時間停止中でない間だけ減っていく
  }

  function exitFever(){
    inFever = false;
    appEl.classList.remove('fever');
    feverLights.classList.remove('show');
    comboTimer = setTimeout(()=>{ comboCount = 0; }, COMBO_TIMEOUT_MS);
  }

  let timerResumeTimeout = null;

  function pauseTimer(ms){
    clearInterval(timerHandle);
    clearTimeout(timerResumeTimeout); // 先に予約されていた再開処理をキャンセルし、二重にsetIntervalが走らないようにする
    timerResumeTimeout = setTimeout(()=>{
      if(gameActive) timerHandle = setInterval(tick, 1000);
    }, ms);
  }

  // 演出完了など、明示的なタイミングで確実にタイマーを再開させたい場合に使う。
  // pauseTimer(ms) で予約された自動再開より早く終わったとき（あるいはズレを防ぎたいとき）に呼ぶ。
  function resumeTimerNow(){
    clearTimeout(timerResumeTimeout);
    clearInterval(timerHandle);
    if(gameActive) timerHandle = setInterval(tick, 1000);
  }

  // ------------------------------------------------------------
  // Skill
  // ------------------------------------------------------------
  function updateSkillGaugeUI(){
    if(isPairMode()){
      // ペアツム（ジャック＆サリー）：ジャック・サリーそれぞれ専用のリングを独立して更新する
      skillRingWrap2.style.display = '';
      const pctJack = Math.min(100, (jackGauge/SKILL_GAUGE_MAX)*100);
      const pctSally = Math.min(100, (sallyGauge/SKILL_GAUGE_MAX)*100);
      skillRingWrap.style.setProperty('--pct', pctJack);
      skillRingWrap2.style.setProperty('--pct', pctSally);
      if(jackGauge >= SKILL_GAUGE_MAX && !jackReady){
        jackReady = true;
        skillRingWrap.classList.add('ready');
      }
      if(sallyGauge >= SKILL_GAUGE_MAX && !sallyReady){
        sallyReady = true;
        skillRingWrap2.classList.add('ready');
      }
      return;
    }
    skillRingWrap2.style.display = 'none';
    const pct = Math.min(100, (skillGauge/SKILL_GAUGE_MAX)*100);
    skillRingWrap.style.setProperty('--pct', pct);
    if(skillGauge >= SKILL_GAUGE_MAX && !skillReady){
      skillReady = true;
      skillRingWrap.classList.add('ready');
    }
  }

  // フィーバーゲージ（画面下のバー）の見た目を更新
  function updateFeverGaugeUI(){
    if(inFever){
      // フィーバー中：満タン→フィーバー終了と同時にちょうど空になるよう、残り時間に応じて一定速度で減らす
      const pct = Math.max(0, Math.min(100, (feverRemainingMs/(FEVER_DURATION*1000))*100));
      feverFill.style.width = pct+'%';
      feverGaugeWrap.classList.add('feverRainbow');
    } else {
      const pct = Math.min(100, (feverGauge/FEVER_GAUGE_MAX)*100);
      feverFill.style.width = pct+'%';
      feverGaugeWrap.classList.remove('feverRainbow');
    }
  }


  // マイツム消去分をスキルゲージへ加算。満タンをあふれた分は次のゲージへ繰り越す
  // （本家の「ゲージ連打」テクニックを、演出待ちなしで自動的に再現したもの）
  function currentSkillNeed(){
    const hero = TSUM_TYPES.find(t=>t.key===myTsumKey);
    return (hero && hero.skillNeed) || 11;
  }

  // ジャック・サリーそれぞれの消去数を個別ゲージへ加算する（ペアツム専用。片方が満タンでも、
  // もう片方はスキル発動とは無関係に独立して溜まり続ける）
  function addPairSkillGauge(erasedList, rate, ignoreGastonRain){
    if((gastonRainActive && !ignoreGastonRain) || !erasedList || erasedList.length===0) return;
    const r = (rate===undefined) ? 1 : rate;
    const jackType = TSUM_TYPES.find(t=>t.key==='jack');
    const sallyType = TSUM_TYPES.find(t=>t.key==='sally');
    const jackCount = erasedList.reduce((sum,t)=> sum + (t.isMine && t.type.key==='jack' ? (t.isBig?BIG_TSUM_COUNT_WEIGHT:1) : 0), 0) * r;
    const sallyCount = erasedList.reduce((sum,t)=> sum + (t.isMine && t.type.key==='sally' ? (t.isBig?BIG_TSUM_COUNT_WEIGHT:1) : 0), 0) * r;
    if(jackCount>0 && !jackReady){
      jackGauge = Math.min(SKILL_GAUGE_MAX, jackGauge + jackCount*(SKILL_GAUGE_MAX/jackType.skillNeed));
    }
    if(sallyCount>0 && !sallyReady){
      sallyGauge = Math.min(SKILL_GAUGE_MAX, sallyGauge + sallyCount*(SKILL_GAUGE_MAX/sallyType.skillNeed));
    }
    if(jackCount>0 || sallyCount>0) updateSkillGaugeUI();
  }

  // myCount: マイツム消去数（大ツム加重込み）。rate: ゲージへの反映率（省略時は1＝100%）
  // ignoreGastonRain: true の場合、ガストン降臨タイム中でもゲージ加算をブロックしない
  //   （効果時間外で繋いだチェーンが、消去演出中に降臨タイム突入してしまっても取りこぼさないための救済）
  function addSkillGauge(myCount, erasedList, rate, ignoreGastonRain){
    const r = (rate===undefined) ? 1 : rate;
    if(isPairMode()){
      addPairSkillGauge(erasedList || [], r, ignoreGastonRain);
      return;
    }
    if(myCount<=0) return;
    // ガストンのハンティングショット後6秒間は、ガストンを消してもゲージが溜まらない
    // （ただし、効果時間外で繋ぎ始めたチェーンの場合は ignoreGastonRain によりこの制限を無視する）
    if(gastonRainActive && !ignoreGastonRain) return;
    if(skillReady) return; // 満タン後にさらに消しても、あふれた分は繰り越さない
    const gain = myCount*r*(SKILL_GAUGE_MAX/currentSkillNeed());
    skillGauge = Math.min(SKILL_GAUGE_MAX, skillGauge + gain);
    updateSkillGaugeUI();
  }

  skillRingWrap.addEventListener('click', ()=>{
    if(!gameActive) return;
    if(isPairMode()){
      // ジャック側のリング：ジャックのゲージが満タンなら、他方のスキルの発動状況に関わらず単独で使える
      if(!jackReady || skillActive) return;
      activatePairSkill('jack');
      return;
    }
    if(!skillReady || skillActive) return;
    activateSkill();
  });

  skillRingWrap2.addEventListener('click', ()=>{
    if(!gameActive || !isPairMode()) return;
    // サリー側のリング：サリーのゲージが満タンなら単独で使える
    if(!sallyReady || skillActive) return;
    activatePairSkill('sally');
  });

  // ペアツム専用：ジャック・サリーはゲージが別々なので、どちらかが満タンになった時点でそれぞれ独立して発動できる。
  // 例外として、サリーのスキル効果中にジャックを発動した場合のみ、合体演出（ジャック＆サリー全消去）になる。
  function activatePairSkill(who){
    skillActive = true;

    if(selecting){
      selectedPath.forEach(t=>t.el.classList.remove('selected','namineLinkable','hookLinkable','sallyLinkable'));
      selecting=false; selectedPath=[]; ropeSvg.innerHTML=''; linkCountEl.textContent='0'; chainCountBadge.classList.remove('show'); lastPointerPoint=null;
    }
    pauseTimer(650);

    if(who==='jack'){
      jackReady = false; jackGauge = 0;
      skillRingWrap.classList.remove('ready');
      updateSkillGaugeUI();
      skillJackScramble();
    } else {
      sallyReady = false; sallyGauge = 0;
      skillRingWrap2.classList.remove('ready');
      updateSkillGaugeUI();
      skillSallyStitch();
    }
  }

  function activateSkill(){
    skillActive = true;
    skillReady = false;
    skillGauge = 0;
    skillRingWrap.classList.remove('ready');
    updateSkillGaugeUI();

    if(selecting){
      selectedPath.forEach(t=>t.el.classList.remove('selected','namineLinkable','hookLinkable','sallyLinkable'));
      selecting=false; selectedPath=[]; ropeSvg.innerHTML=''; linkCountEl.textContent='0'; chainCountBadge.classList.remove('show'); lastPointerPoint=null;
    }

    pauseTimer(650);

    const skillFns = {
      pink: skillEraser,
      purple: skillFriendChange,
      yellow: skillTimeBonus,
      mint: skillLuckyTime,
      blue: skillRoyalClear,
      orange: skillDevilBomb,
      gaston: skillGastonLine,
      buzz: skillBuzzLightyear,
      namine: skillNamine,
      hook: skillHookFinalBattle,
      beast: skillBeastClaw,
      duffy: skillDuffyTrapezoid,
      stitch: skillStitchHero,

  function finishSkill(){
    skillActive = false;
    skillTimeFreeze = false;
    appEl.classList.remove('timeStopDimmed');
    if(isPairMode()) updateSkillGaugeUI();

  function showSkillLabel(text, extraClass){
    comboDisplay.textContent = text;
    comboDisplay.classList.remove('show','jackSallyLabel');
    if(extraClass) comboDisplay.classList.add(extraClass);
    void comboDisplay.offsetWidth;
    comboDisplay.classList.add('show');

  // プリンス：マイツムを全消しして大量スコア＆コイン
  function skillRoyalClear(){
    const myTsums = tsums.filter(t=>t.isMine && !t.isBomb && !t.ghost);
    if(myTsums.length===0){ finishSkill(); return; }

    const effectiveN = myTsums.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    const bonus = computeScore(myTsums, effectiveN);
    score += bonus;
    scoreVal.textContent = score.toLocaleString();
    const myTsumType = TSUM_TYPES.find(t=>t.key===myTsumKey);
    const gainedCoins = coinsForChain(effectiveN, myTsumType.coinBonus);
    coins += gainedCoins;
    coinVal.textContent = coins.toLocaleString();
    if(effectiveN > maxChain) maxChain = effectiveN;
    chainVal.textContent = maxChain;

    showSkillLabel(`ロイヤルクリア！ マイツム${myTsums.length}個消去 +${bonus}`);
    const eraseCountPos = showEraseCount(myTsums, effectiveN);
    burstSparkles(myTsums);
    const suckTargets = buildSuckTargets(myTsums);
    if(gainedCoins>0) burstCoins(myTsums, gainedCoins);

    // 消去系スキルは中心点から外側へ同心円状（ウェーブ）に消えていく
    const center = {x:boardW/2, y:boardH/2};
    const spawnBomb = effectiveN >= bombChainThreshold;
    const bombSpot = spawnBomb ? eraseCountPos : null;
    popWithWave(myTsums, center, 'popping', ()=>{
      refillIfNeeded(myTsums.map(t=>t.x));
      finishSkill();
      checkFeverTrigger();
    }, true, ()=>{ if(bombSpot) spawnBombAt(bombSpot); }, false, suckTargets);
  }

  // うさこ：種類を問わず盤面のツムを広範囲にランダム消去
  function skillEraser(){
    const candidates = tsums.filter(t=>!t.isBomb && !t.ghost);
    if(candidates.length===0){ finishSkill(); return; }
    shuffleArr(candidates);
    const count = Math.min(candidates.length, Math.max(6, Math.round(candidates.length*0.35)));
    const targets = candidates.slice(0, count);

    const effectiveN = targets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
    const bonus = computeScore(targets, effectiveN);
    score += bonus;
    scoreVal.textContent = score.toLocaleString();
    const gainedCoins = coinsForChain(effectiveN, TSUM_TYPES.find(t=>t.key===myTsumKey).coinBonus);
    coins += gainedCoins;
    coinVal.textContent = coins.toLocaleString();
    if(effectiveN > maxChain) maxChain = effectiveN;
    chainVal.textContent = maxChain;

    const myCount = targets.reduce((sum,t)=> sum + (t.isMine ? (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1) : 0), 0);

    showSkillLabel(`ともだちイレイサー！ ${targets.length}個消去 +${bonus}`);
    const eraseCountPos = showEraseCount(targets, effectiveN);
    burstSparkles(targets);
    const suckTargets = buildSuckTargets(targets);
    if(gainedCoins>0) burstCoins(targets, gainedCoins);

    const center = {x:boardW/2, y:boardH/2};
    const spawnBomb = effectiveN >= bombChainThreshold;
    const bombSpot = spawnBomb ? eraseCountPos : null;
    popWithWave(targets, center, 'popping', ()=>{
      refillIfNeeded(targets.map(t=>t.x));
      finishSkill();
      checkFeverTrigger();
    }, true, ()=>{ if(bombSpot) spawnBombAt(bombSpot); }, false, suckTargets);
  }

  // にゃんた：盤面のツムの一部をマイツムに変化（消さずにチェーンしやすくする）
  function skillFriendChange(){
    const others = tsums.filter(t=>!t.isMine && !t.isBomb && !t.ghost);
    if(others.length===0){ finishSkill(); return; }
    shuffleArr(others);
    const count = Math.min(others.length, 8);
    const targets = others.slice(0, count);
    const myType = TSUM_TYPES.find(t=>t.key===myTsumKey);

    targets.forEach(t=>{
      t.type = myType;
      t.isMine = true;
      const size = t.r*2;
      const newEl = createTsumEl(myType, true, size);
      newEl.style.transform = t.el.style.transform;
      t.el.replaceWith(newEl);
      t.el = newEl;
      attachHandlers(t);
    });

    showSkillLabel(`なかまチェンジ！ ${targets.length}個がマイツムに`);
    burstSparkles(targets);
    setTimeout(()=>{ finishSkill(); }, 320);
  }

  // ぴよすけ：残り時間をプラス
  function skillTimeBonus(){
    const addSec = 8;
    timeLeft += addSec;
    timeVal.textContent = timeLeft;
    timerBox.classList.remove('warn');
    showSkillLabel(`タイムボーナス！ +${addSec}秒`);
    setTimeout(()=>{ finishSkill(); }, 320);
  }

  // みんとる：数秒間スコアが2倍になる
  function skillLuckyTime(){
    scoreMultiplier = 2;
    if(scoreMultiplierEndTimer) clearTimeout(scoreMultiplierEndTimer);
    scoreMultiplierEndTimer = setTimeout(()=>{ scoreMultiplier = 1; }, 6000);
    showSkillLabel('ラッキータイム！ 6秒間スコア2倍');
    setTimeout(()=>{ finishSkill(); }, 320);
  }

  // あくまる：盤面のツムをランダムにボム化する
  function skillDevilBomb(){
    const candidates = tsums.filter(t=>!t.isBomb && !t.ghost);
    if(candidates.length===0){ finishSkill(); return; }
    shuffleArr(candidates);
    const count = Math.min(candidates.length, 3);
    const targets = candidates.slice(0, count);
    targets.forEach(t=> markAsBomb(t));

    showSkillLabel(`デビルボム！ ボムが${targets.length}個出現`);
    burstSparkles(targets);
    setTimeout(()=>{ finishSkill(); }, 320);
  }

  function shuffleArr(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  // ガストン：横一列に3発撃ちぬいてツムを消去する（銃を構えたシルエット＋マズルフラッシュ演出）
  function skillGastonLine(){
    const myTsums = tsums.filter(t=>t.isMine && !t.isBomb && !t.ghost);
    if(myTsums.length===0){ finishSkill(); return; }

    // 銃撃〜消去演出が終わるまで、盤面の物理演算とゲーム内タイマーを完全に停止する
    boardFrozen = true;
    pauseTimer(1300);

    // 横一列の高さは盤面中央に固定（マイツムの位置によって毎回変わらないようにする）
    const bandY = boardH/2;
    const bandHalf = tsumRadius*1.8; // 約1.8列分の縦幅（以前より狭く）
    const targets = tsums
      .filter(t=> !t.isBomb && !t.ghost && Math.abs(t.y-bandY) <= bandHalf)
      .sort((a,b)=> a.x - b.x); // 左から右へ順に消えるように並べておく

    showGastonShots(bandY, bandHalf, ()=>{
      if(targets.length===0){ boardFrozen = false; finishSkill(); return; }

      const effectiveN = targets.reduce((sum,t)=> sum + (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1), 0);
      const bonus = computeScore(targets, effectiveN);
      score += bonus;
      scoreVal.textContent = score.toLocaleString();
      const gainedCoins = coinsForChain(effectiveN, -1);
      coins += gainedCoins;
      coinVal.textContent = coins.toLocaleString();
      const myCount = targets.reduce((sum,t)=> sum + (t.isMine ? (t.isBig ? BIG_TSUM_COUNT_WEIGHT : 1) : 0), 0);

      burstSparkles(targets);
      const suckTargets = buildSuckTargets(targets);
      if(gainedCoins>0) burstCoins(targets, gainedCoins);
      const eraseCountPos = showEraseCount(targets, effectiveN);

      // レーザーが走るように左から右へ時間差で消えていく
      const spawnBomb = effectiveN >= bombChainThreshold;
      const bombSpot = spawnBomb ? eraseCountPos : null;
      startGastonRain(); // 横ライン消去が発生した瞬間にガストン降臨タイムを開始
      popWithWave(targets, null, 'popping', ()=>{
        boardFrozen = false; // 演出が終わったら盤面の時間を再開
        refillIfNeeded(targets.map(t=>t.x));
        finishSkill();
        checkFeverTrigger();
      }, true, ()=>{ if(bombSpot) spawnBombAt(bombSpot); }, false, suckTargets);
    });
  }

  // 横を向いて銃身の長い銃を構え、3発のマズルフラッシュを発生させてからビームで薙ぎ払う演出
  function showGastonShots(bandY, bandHalf, onDone){
    const layer = document.createElement('div');
    layer.className = 'gastonShotLayer';
    layer.style.top = bandY+'px';
    board.appendChild(layer);

    const gunner = document.createElement('div');
    gunner.className = 'gastonGunner';
    const body = document.createElement('div');
    body.className = 'gastonBody';
    const barrel = document.createElement('div');
    barrel.className = 'gastonBarrel';
    gunner.appendChild(body);
    gunner.appendChild(barrel);
    layer.appendChild(gunner);

    const beamThickness = Math.max(6, bandHalf*2);
    const beam = document.createElement('div');
    beam.className = 'gastonBeam';
    beam.style.height = beamThickness+'px';
    beam.style.top = (-beamThickness/2)+'px';
    layer.appendChild(beam);

    const flashXs = [0.18, 0.5, 0.82].map(p=> boardW*p);
    flashXs.forEach((x, i)=>{
      setTimeout(()=>{
        const flash = document.createElement('div');
        flash.className = 'gastonFlash';
        flash.style.left = x+'px';
        layer.appendChild(flash);
        setTimeout(()=> flash.remove(), 240);
      }, i*150);
    });

    setTimeout(()=>{ beam.classList.add('fire'); }, 460);

    setTimeout(()=>{
      layer.remove();
      onDone && onDone();
    }, 740);
  }

  // ハンティングショットの後、6秒間はガストンだけが降ってくるボーナスタイム
  // （背景がオレンジに変化。この間はガストンを消してもスキルゲージは溜まらない）
  function startGastonRain(){
    gastonRainActive = true;
    appEl.classList.add('gastonRain');
    clearTimeout(gastonRainTimer);
